<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리밸런서 · 모바일</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="리밸런서">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --panel2:#161d2b; --line:#232b3a;
    --ink:#e8edf5; --muted:#9aa6b8; --dim:#69748a;
    --accent:#4c8dff; --up:#e5484d; --down:#3fb950; --gold:#c9a227;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:40px}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
  header .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);cursor:pointer;font-size:16px;flex-shrink:0}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 로그인 화면 ---- */
  #loginScreen{min-height:88vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:24px}
  .mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#7c5cff);
    display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:22px;
    box-shadow:0 8px 30px -6px rgba(76,141,255,.5)}
  #loginScreen h2{font-size:19px;margin:0 0 8px;font-weight:700}
  #loginScreen p{font-size:13px;color:var(--muted);line-height:1.6;max-width:280px;margin:0 0 26px}
  .g-btn{background:var(--ink);color:#0a0e14;border:none;border-radius:12px;
    padding:13px 26px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px -4px rgba(0,0,0,.4)}
  .g-btn:active{transform:scale(.97)}
  .scope-note{margin-top:16px;font-size:11px;color:var(--dim);max-width:260px;line-height:1.6}
  .auto-checking{display:flex;flex-direction:column;align-items:center;gap:12px;
    color:var(--dim);font-size:12.5px}
  .auto-checking .spinner{width:22px;height:22px;border-radius:50%;
    border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}

  /* ---- 상태 메시지 ---- */
  .state-box{margin:60px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}
  .state-box .big{font-size:28px;margin-bottom:10px}
  .err-box{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.3);
    border-radius:12px;padding:16px;margin:16px;font-size:12px;color:#ff9a9d;line-height:1.6}

  /* ---- 추세 신호 ---- */
  .trend-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px}
  .chart-title{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:10px}
  .chart-box{position:relative;height:190px}
  .chip-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;font-size:11.5px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
  .chip.active{background:rgba(76,141,255,.16);border-color:var(--accent);color:var(--accent);font-weight:600}
  .trend-cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 8px;text-align:center}
  .trend-cell .sym{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.03em}
  .trend-cell .lbl{font-size:13px;font-weight:700;margin-top:4px}
  .trend-cell .score{font-size:10px;color:var(--dim);margin-top:2px}
  .trend-cell.none{border-color:rgba(63,185,80,.35)}
  .trend-cell.watch{border-color:rgba(201,162,39,.4)}
  .trend-cell.sell{border-color:rgba(232,131,74,.45)}
  .trend-cell.strong{border-color:rgba(229,72,77,.5)}
  .trend-cell.none .lbl{color:var(--down)}
  .trend-cell.watch .lbl{color:var(--gold)}
  .trend-cell.sell .lbl{color:#e8834a}
  .trend-cell.strong .lbl{color:var(--up)}

  /* ---- 계좌 카드 ---- */
  .acct{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    margin-bottom:12px;overflow:hidden}
  .acct-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer}
  .acct-name{font-size:14px;font-weight:700}
  .acct-sub{font-size:11px;color:var(--dim);margin-top:2px}

  .sig-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;
    border-radius:999px;vertical-align:middle;margin-left:2px}
  .sig-sell{background:rgba(229,72,77,.18);color:#ff9a9d}
  .sig-sellwatch{background:rgba(232,131,74,.18);color:#f0b483}
  .sig-hold{background:rgba(154,166,184,.15);color:var(--muted)}
  .sig-buywatch{background:rgba(91,191,106,.18);color:#8fe0a0}
  .sig-buy{background:rgba(63,185,80,.2);color:#7ee2a0}

  .gap-row{display:flex;justify-content:space-between;padding:0 16px 10px;
    font-size:11.5px;color:var(--muted)}
  .gap-detail{display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--line);border-top:1px solid var(--line)}
  .gap-cell{background:var(--panel);padding:9px 16px}
  .gap-k{font-size:10px;color:var(--dim)}
  .gap-v{font-size:12px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .gap-pct{font-size:10px;font-weight:400;color:var(--dim);margin-left:4px}
  .acct-right{text-align:right}
  .acct-total{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .acct-profit{font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
  .acct-chev{color:var(--dim);font-size:11px;margin-left:8px;transition:transform .15s}
  .acct.open .acct-chev{transform:rotate(180deg)}
  .up{color:var(--up)} .down{color:var(--down)}

  .holdings{max-height:0;overflow:hidden;transition:max-height .2s ease}
  .acct.open .holdings{max-height:2000px}
  .h-row{display:flex;align-items:center;justify-content:space-between;
    padding:9px 16px;border-top:1px solid var(--line);font-size:12px}
  .h-name{color:var(--ink);font-weight:600}
  .h-sub{color:var(--dim);font-size:10.5px;margin-top:1px}
  .h-right{text-align:right;font-variant-numeric:tabular-nums}
  .h-val{color:var(--muted)}
  .h-empty{padding:14px 16px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}

  .grand{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    padding:16px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 20px}
  .grand .k{font-size:12px;color:var(--muted)}
  .grand .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

  .footer-note{text-align:center;font-size:10.5px;color:var(--dim);margin-top:24px;line-height:1.7}
  .footer-note a{color:var(--dim)}

  #app{display:none}
</style>
</head>
<body>

<div id="loginScreen" class="wrap">
  <div class="mark">📊</div>
  <h2>리밸런서 모바일</h2>
  <p>PC 리밸런서가 구글 드라이브에 저장한<br>최신 데이터를 읽기 전용으로 확인합니다.</p>
  <div id="autoChecking" class="auto-checking">
    <div class="spinner"></div>
    <div>로그인 확인 중…</div>
  </div>
  <div id="loginBtnWrap" style="display:none;flex-direction:column;align-items:center">
    <button class="g-btn" onclick="login()">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.6H24v9.1h11.9c-.5 2.8-2.1 5.1-4.4 6.7v5.6h7.1c4.2-3.8 6.5-9.5 6.5-16.8z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.6c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 40.9 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.8 27.2c-.4-1.3-.7-2.7-.7-4.2s.2-2.9.7-4.2v-5.7H4.5C3 16 2 19.9 2 24s1 8 4.5 10.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.4 2 8.1 7.1 4.5 13.1l7.3 5.7c1.7-5.2 6.5-9 12.2-9.1z"/></svg>
      구글로 로그인
    </button>
    <div class="scope-note">읽기 전용 권한만 요청합니다. 이 페이지는 파일을 수정하거나 삭제할 수 없습니다.</div>
  </div>
</div>

<div id="app">
  <header>
    <div>
      <h1>리밸런서</h1>
      <div class="sub" id="updatedAt">불러오는 중…</div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="icon-btn" id="refreshBtn" onclick="loadPortfolio()" title="새로고침">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      </div>
      <div class="icon-btn" onclick="logout()" title="로그아웃">⏻</div>
    </div>
  </header>

  <div class="wrap">
    <div id="content"></div>
  </div>
</div>

<script>
const CLIENT_ID = '155085390291-minre2sngn71m9rsjdnssrmlc0u2178q.apps.googleusercontent.com';
// drive.readonly 만으로는 로그인 계정 이메일 조회(userinfo)가 거부되어
// "계정 기억하기"가 동작하지 않았음. 이메일 확인 권한을 추가로 요청.
const SCOPE = 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/userinfo.email';
const FOLDER_NAME = 'Rebalancer';
const FILE_NAME = 'portfolio.json';

let tokenClient = null;
let accessToken = null;
let DATA = null;
let openAccts = {};
let charts = {};

function initGoogle(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: (resp) => {
      clearTimeout(autoLoginTimeout);
      if (resp.error) {
        // 자동(조용한) 로그인 실패 → 버튼이 있는 로그인 화면 그대로 노출
        setAutoChecking(false);
        return;
      }
      accessToken = resp.access_token;
      rememberAccountHint();
      showApp();
      loadPortfolio();
    }
  });
  // 페이지를 열 때마다 자동으로 시도: 브라우저에 구글 로그인이 남아있고
  // 이전에 이 페이지에 권한을 허용했다면, 버튼 없이 조용히 새 토큰을 받아온다.
  // 이전에 로그인했던 계정을 hint로 넘겨주면, 계정이 여러 개 있어도
  // 매번 계정 선택 화면이 뜨지 않고 그 계정으로 바로 시도한다.
  const savedHint = localStorage.getItem('g_hint_email') || undefined;
  setAutoChecking(true);
  tokenClient.requestAccessToken({ prompt: '', hint: savedHint });
  // 혹시 콜백이 안 오는 경우를 대비한 안전장치
  autoLoginTimeout = setTimeout(() => setAutoChecking(false), 4000);
}

// 로그인한 계정의 이메일을 기억해둬서, 다음 방문 때 계정 선택 없이 바로 그 계정으로 시도
async function rememberAccountHint(){
  try{
    const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if (!r.ok) return;
    const info = await r.json();
    if (info.email) localStorage.setItem('g_hint_email', info.email);
  } catch(e){ /* 실패해도 무시 — 계정 기억 기능만 못 쓸 뿐 로그인 자체엔 지장 없음 */ }
}

let autoLoginTimeout = null;
function setAutoChecking(on){
  const btn = document.getElementById('loginBtnWrap');
  const checking = document.getElementById('autoChecking');
  if (btn) btn.style.display = on ? 'none' : 'flex';
  if (checking) checking.style.display = on ? 'block' : 'none';
}

function login(){
  const savedHint = localStorage.getItem('g_hint_email') || undefined;
  tokenClient.requestAccessToken({ prompt: 'consent', hint: savedHint });
}
function logout(){
  if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null; DATA = null;
  localStorage.removeItem('g_hint_email');   // 명시적 로그아웃 시엔 기억해둔 계정도 지움
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  setAutoChecking(false);
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

async function driveFetch(url, retried){
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (r.status === 401) {
    if (!retried) {
      // 토큰이 만료됐으면 조용히 한 번 더 재발급 시도 후 재요청
      const refreshed = await silentRefresh();
      if (refreshed) return driveFetch(url, true);
    }
    throw new Error('로그인이 만료됐습니다. 다시 로그인해주세요.');
  }
  if (!r.ok) throw new Error('구글 드라이브 요청 실패 (' + r.status + ')');
  return r.json();
}

function silentRefresh(){
  return new Promise((resolve) => {
    const prevCb = tokenClient.callback;
    tokenClient.callback = (resp) => {
      tokenClient.callback = prevCb;
      if (resp.error) { resolve(false); return; }
      accessToken = resp.access_token;
      resolve(true);
    };
    const savedHint = localStorage.getItem('g_hint_email') || undefined;
    tokenClient.requestAccessToken({ prompt: '', hint: savedHint });
  });
}

async function loadPortfolio(){
  const btn = document.getElementById('refreshBtn');
  const content = document.getElementById('content');
  btn.classList.add('spin');
  document.getElementById('updatedAt').textContent = '불러오는 중…';
  try{
    // 1) Rebalancer 폴더 찾기
    const fq = encodeURIComponent(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const folderRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${fq}&fields=files(id,name)`);
    const folder = (folderRes.files || [])[0];
    if (!folder) {
      showEmpty('구글 드라이브에서 "Rebalancer" 폴더를 찾지 못했습니다.<br>PC에서 Update나 저장을 한 번 해주세요.');
      return;
    }
    // 2) portfolio.json 찾기
    const ffq = encodeURIComponent(`name='${FILE_NAME}' and '${folder.id}' in parents and trashed=false`);
    const fileRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${ffq}&fields=files(id,name,modifiedTime)`);
    const file = (fileRes.files || [])[0];
    if (!file) {
      showEmpty('폴더는 있지만 portfolio.json을 찾지 못했습니다.<br>PC에서 저장을 한 번 해주세요.');
      return;
    }
    // 3) 내용 다운로드
    DATA = await driveFetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`);
    const d = new Date(file.modifiedTime);
    document.getElementById('updatedAt').textContent = '마지막 저장 · ' + d.toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    render();
  } catch(e){
    showError(e.message || String(e));
  } finally {
    btn.classList.remove('spin');
  }
}

function showEmpty(msg){
  document.getElementById('content').innerHTML = `<div class="state-box"><div class="big">📭</div>${msg}</div>`;
}
function showError(msg){
  document.getElementById('content').innerHTML = `<div class="err-box">${msg}</div>`;
}

const won = n => (n==null||isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');
const numUS = n => (n==null||isNaN(n)) ? '-' : Number(n).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:4});
const pct = n => (n==null||isNaN(n)) ? '-' : ((n>=0?'+':'') + (n*100).toFixed(1) + '%');

// PC 앱(app.py compute_account)과 동일한 계산식
// PC 앱(app.py target_stock_ratio)과 동일한 공식
function targetStockRatio(settings, market){
  const peak = settings.peakStockRatio;
  const dd = settings.maxDrawdownAssumption;
  const kd = market.kospiHigh ? (market.kospiNow - market.kospiHigh) / market.kospiHigh : 0;
  const nd = market.nasdaqHigh ? (market.nasdaqNow - market.nasdaqHigh) / market.nasdaqHigh : 0;
  const nw = settings.nasdaqWeight != null ? settings.nasdaqWeight : 0.85;
  const kw = settings.kospiWeight != null ? settings.kospiWeight : 0.25;
  const weighted = nd * nw + kd * kw;
  return Math.min(1, peak - (1 - peak) * weighted / dd);
}

// PC 앱(app.py _signal_label)과 동일한 5단계 판정
function signalLabel(gap, th){
  th = th || {};
  const sell = th.sell != null ? th.sell : 0.06;
  const sellWatch = th.sellWatch != null ? th.sellWatch : 0.03;
  const buyWatch = th.buyWatch != null ? th.buyWatch : -0.03;
  const buy = th.buy != null ? th.buy : -0.06;
  if (gap >= sell) return { text: '매도', cls: 'sig-sell' };
  if (gap >= sellWatch) return { text: '매도 고민', cls: 'sig-sellwatch' };
  if (gap >= buyWatch) return { text: '관망', cls: 'sig-hold' };
  if (gap >= buy) return { text: '매수 고민', cls: 'sig-buywatch' };
  return { text: '매수', cls: 'sig-buy' };
}

function computeAccount(acc, fx, settings, market){
  let krStock = 0, usStock = 0;
  const rows = [];
  (acc.holdings || []).forEach(h => {
    const price = h.price || 0;
    const val = (h.qty || 0) * price;
    const isUS = h.market === 'US';
    const valKR = isUS ? val * fx : val;
    if (isUS) usStock += valKR; else krStock += valKR;
    rows.push({ name: h.name || h.code, code: h.code, qty: h.qty || 0, price, isUS, valKR });
  });
  const cash = (acc.cashKRW || 0) + (acc.cashUSD || 0) * fx;
  const total = krStock + usStock + cash;
  const seed = acc.seed || 0;
  const profit = total - seed;
  const profitRate = seed ? profit / seed : null;
  const stockRatio = total ? (krStock + usStock) / total : 0;
  rows.sort((a,b) => b.valKR - a.valKR);

  // 목표 비중·괴리 (계산 불가 상황이면 조용히 생략)
  let tRatio = null, gap = null, sig = null;
  let krGap = null, usGap = null, krGapRatio = null, usGapRatio = null;
  const krOnly = !!acc.krOnly;
  try{
    tRatio = targetStockRatio(settings, market);
    gap = stockRatio - tRatio;
    sig = signalLabel(gap, acc.thresholds);
    const dom = krOnly ? 1.0 : (settings.domesticTargetRatio != null ? settings.domesticTargetRatio : 0.5);
    const recKR = total * tRatio * dom;
    const recUS = total * tRatio * (1 - dom);
    krGap = krStock - recKR;
    usGap = usStock - recUS;
    const krRatio = total ? krStock / total : 0;
    const usRatio = total ? usStock / total : 0;
    krGapRatio = krRatio - tRatio * dom;
    usGapRatio = usRatio - tRatio * (1 - dom);
  } catch(e){ /* 설정값이 없으면 배지·괴리 없이 표시 */ }

  return { total, profit, profitRate, rows, cash, stockRatio, krStock, usStock,
    tRatio, gap, sig, krGap, usGap, krGapRatio, usGapRatio, krOnly };
}

function trendCell(sym, sig){
  const comp = sig && sig[sym] && sig[sym].composite;
  if (!comp) return `<div class="trend-cell"><div class="sym">${sym}</div><div class="lbl" style="color:var(--dim)">-</div></div>`;
  const lvlClass = comp.level === 'none' ? 'none' : comp.level === 'watch' ? 'watch' : comp.level === 'sell' ? 'sell' : 'strong';
  return `<div class="trend-cell ${lvlClass}">
    <div class="sym">${sym}</div>
    <div class="lbl">${comp.label}</div>
    <div class="score">${comp.score}/100</div>
  </div>`;
}

function toggleAcct(name){
  openAccts[name] = !openAccts[name];
  render();
}

function render(){
  if (!DATA) return;
  const fx = (DATA.market && DATA.market.usdKrw) || 0;
  const sig = DATA.trendSignals;
  const settings = DATA.settings || {};
  const market = DATA.market || {};
  ensurePickedAccts();

  let html = '';
  html += `<div class="trend-row">${['QQQ','SOXX','EWY'].map(s => trendCell(s, sig)).join('')}</div>`;

  // ---- 수익 금액 (계좌별 켜고 끄기) ----
  html += `<div class="chart-card">
    <div class="chart-title">수익 금액</div>
    <div class="chip-row" id="profitChips"></div>
    <div class="chart-box"><canvas id="historyChart"></canvas></div>
  </div>`;

  // ---- 주식 비중 및 수익률 ----
  html += `<div class="chart-card">
    <div class="chart-title">주식 비중 및 수익률</div>
    <div class="chart-box"><canvas id="ratioChart"></canvas></div>
  </div>`;

  let grandTotal = 0, grandProfit = 0;
  (DATA.accounts || []).forEach(acc => {
    const r = computeAccount(acc, fx, settings, market);
    grandTotal += r.total; grandProfit += r.profit;
    const open = !!openAccts[acc.name];
    const holdingsHtml = r.rows.length
      ? r.rows.map(row => `
        <div class="h-row">
          <div>
            <div class="h-name">${row.name}</div>
            <div class="h-sub">${row.qty}${row.isUS ? '주' : '주'} · ${row.isUS ? numUS(row.price) : won(row.price)}${row.isUS?' USD':'원'}</div>
          </div>
          <div class="h-right h-val">${won(row.valKR)}원</div>
        </div>`).join('')
      : `<div class="h-empty">보유 종목 없음</div>`;

    const sigBadge = r.sig ? `<span class="sig-badge ${r.sig.cls}">${r.sig.text}</span>` : '';
    const gapLine = r.gap != null
      ? `<div class="gap-row">
          <span>주식비중 ${(r.stockRatio*100).toFixed(1)}%</span>
          <span class="${r.gap>=0?'up':'down'}">괴리 ${r.gap>=0?'+':''}${(r.gap*100).toFixed(1)}%</span>
        </div>`
      : '';
    const gapDetail = r.krGap != null
      ? `<div class="gap-detail">
          <div class="gap-cell">
            <div class="gap-k">국장 괴리금</div>
            <div class="gap-v ${r.krGap>=0?'up':'down'}">${r.krGap>=0?'+':''}${won(r.krGap)}원<span class="gap-pct">(${r.krGapRatio>=0?'+':''}${(r.krGapRatio*100).toFixed(1)}%)</span></div>
          </div>
          ${r.krOnly ? '' : `<div class="gap-cell">
            <div class="gap-k">미장 괴리금</div>
            <div class="gap-v ${r.usGap>=0?'up':'down'}">${r.usGap>=0?'+':''}${won(r.usGap)}원<span class="gap-pct">(${r.usGapRatio>=0?'+':''}${(r.usGapRatio*100).toFixed(1)}%)</span></div>
          </div>`}
        </div>`
      : '';

    html += `<div class="acct ${open ? 'open' : ''}">
      <div class="acct-head" onclick="toggleAcct('${acc.name.replace(/'/g,"\\'")}')">
        <div>
          <div class="acct-name">${acc.name} ${sigBadge}</div>
          <div class="acct-sub">보유 ${r.rows.length}종목</div>
        </div>
        <div style="display:flex;align-items:center">
          <div class="acct-right">
            <div class="acct-total">${won(r.total)}원</div>
            <div class="acct-profit ${r.profit>=0?'up':'down'}">${r.profit>=0?'+':''}${won(r.profit)}원 ${r.profitRate!=null?'('+pct(r.profitRate)+')':''}</div>
          </div>
          <div class="acct-chev">▼</div>
        </div>
      </div>
      ${gapLine}
      ${gapDetail}
      <div class="holdings">${holdingsHtml}</div>
    </div>`;
  });

  html += `<div class="grand">
    <div>
      <div class="k">전체 총자산</div>
      <div class="v">${won(grandTotal)}원</div>
    </div>
    <div style="text-align:right">
      <div class="k">전체 수익금</div>
      <div class="v ${grandProfit>=0?'up':'down'}" style="font-size:15px">${grandProfit>=0?'+':''}${won(grandProfit)}원</div>
    </div>
  </div>`;

  html += `<div class="footer-note">보기 전용 페이지입니다 · 데이터 수정은 PC 리밸런서에서만 가능합니다</div>`;

  document.getElementById('content').innerHTML = html;
  renderProfitChips();
  renderHistoryChart();
  renderRatioChart();
}

let pickedAccts = null;  // {계좌명: true/false}. null이면 최초 렌더 때 전부 true로 채움

function ensurePickedAccts(){
  if (pickedAccts) return;
  pickedAccts = {};
  (DATA.accounts || []).forEach(a => { pickedAccts[a.name] = true; });
}

function togglePickAcct(name){
  ensurePickedAccts();
  pickedAccts[name] = !pickedAccts[name];
  renderHistoryChart();
  renderProfitChips();
}

const CHART_COLORS = ['#4c8dff','#e8834a','#3fb950','#c9a227','#a371f7','#f778ba'];

function renderProfitChips(){
  ensurePickedAccts();
  const box = document.getElementById('profitChips');
  if (!box) return;
  const names = (DATA.accounts || []).map(a => a.name);
  box.innerHTML = names.map((name, i) => {
    const on = !!pickedAccts[name];
    const c = CHART_COLORS[i % CHART_COLORS.length];
    const style = on ? `background:${c};border-color:${c};color:#04101f` : '';
    return `<div class="chip ${on?'active':''}" style="${style}" onclick="togglePickAcct('${name.replace(/'/g,"\\'")}')">${name}</div>`;
  }).join('');
}

function renderHistoryChart(){
  const cv = document.getElementById('historyChart');
  if (!cv || !window.Chart) return;
  ensurePickedAccts();
  const history = DATA.history || [];
  const labels = history.map(r => r.date);

  const datasets = (DATA.accounts || [])
    .map((acc, i) => ({ acc, i }))
    .filter(({acc}) => pickedAccts[acc.name])
    .map(({acc, i}) => {
      const color = CHART_COLORS[i % CHART_COLORS.length];
      const data = history.map(r => (r.profits && r.profits[acc.name] != null) ? r.profits[acc.name] : null);
      return { label: acc.name, data, borderColor: color, backgroundColor: color,
        tension: .25, pointRadius: 2, spanGaps: true };
    });

  if (charts.historyChart) charts.historyChart.destroy();
  charts.historyChart = new Chart(cv, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + won(c.parsed.y) + '원' } }
      },
      scales: {
        x: { ticks: { color: '#5c6773', maxTicksLimit: 6, font: { size: 10 } }, grid: { color: '#20272f' } },
        y: { ticks: { color: '#5c6773', font: { size: 10 }, callback: v => (v/1e6).toFixed(0)+'M' }, grid: { color: '#20272f' } }
      }
    }
  });
}

function renderRatioChart(){
  const cv = document.getElementById('ratioChart');
  if (!cv || !window.Chart) return;
  const fx = (DATA.market && DATA.market.usdKrw) || 0;
  const settings = DATA.settings || {}, market = DATA.market || {};
  const names = [], cur = [], tgt = [], rate = [];
  (DATA.accounts || []).forEach(acc => {
    const r = computeAccount(acc, fx, settings, market);
    names.push(acc.name);
    cur.push(+(r.stockRatio*100).toFixed(1));
    tgt.push(r.tRatio != null ? +(r.tRatio*100).toFixed(1) : null);
    rate.push(r.profitRate != null ? +(r.profitRate*100).toFixed(2) : null);
  });

  if (charts.ratioChart) charts.ratioChart.destroy();
  charts.ratioChart = new Chart(cv, {
    type: 'bar',
    data: { labels: names, datasets: [
      { label: '현재 비중', data: cur, backgroundColor: '#4c8dff', yAxisID: 'y', barPercentage: .7, categoryPercentage: .62 },
      { label: '목표 비중', data: tgt, backgroundColor: '#c9a227', yAxisID: 'y', barPercentage: .7, categoryPercentage: .62 },
      { label: '수익률', data: rate, backgroundColor: '#e5484d', yAxisID: 'y1', barPercentage: .7, categoryPercentage: .62 },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8b98a5', boxWidth: 10, font: { size: 10 } } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (c.parsed.y!=null ? c.parsed.y.toFixed(1) : '-') + '%' } }
      },
      scales: {
        x: { ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { display: false } },
        y: { position: 'left', min: 0, max: 100, ticks: { color: '#5c6773', font: { size: 9 }, callback: v => v+'%' }, grid: { color: '#20272f' } },
        y1: { position: 'right', ticks: { color: '#5c6773', font: { size: 9 }, callback: v => v+'%' }, grid: { drawOnChartArea: false } },
      }
    }
  });
}

window.onload = initGoogle;
</script>
