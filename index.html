function renderCompareBox(){
  const box = document.getElementById('compareBox');
  if (!box) return;
  if (comparePoints.length < 2) { box.innerHTML = ''; return; }
  const [d1, d2] = comparePoints;
  const [a, b] = d1 <= d2 ? [d1, d2] : [d2, d1];
  const r1 = (DATA.history || []).find(r => r.date === a);
  const r2 = (DATA.history || []).find(r => r.date === b);
  if (!r1 || !r2) { box.innerHTML = ''; return; }
  let total = 0;
  const rows = (DATA.accounts || []).filter(acc => pickedAccts[acc.id]).map(acc => {
    const v1 = profitOf(r1, acc), v2 = profitOf(r2, acc);
    if (v1 == null || v2 == null) return `<div class="cmp-row"><span>${esc(acc.name)}</span><span>-</span></div>`;
    const d = v2 - v1; total += d;
    return `<div class="cmp-row"><span>${esc(acc.name)}</span><span class="${d>=0?'up':'down'}">${d>=0?'+':''}${won(d)}원</span></div>`;
  }).join('');
  box.innerHTML = `<div class="cmp-box">
    <div class="cmp-title"><span>${a} → ${b}</span><span class="cmp-clear" onclick="clearCompare()">✕ 해제</span></div>
    ${rows}
    <div class="cmp-total"><span>합계</span><span class="${total>=0?'up':'down'}">${total>=0?'+':''}${won(total)}원</span></div>
  </div>`;
}

const comparePlugin = {
  id: 'comparePlugin',
  afterDatasetsDraw(chart){
    const { ctx, chartArea, scales } = chart;

    // 비교 모드: 선택한 각 날짜에 세로 점선만 (값은 아래 텍스트 패널에 표시됨)
    comparePoints.forEach(d => {
      const x = scales.x.getPixelForValue(new Date(d).getTime());
      if (x == null || isNaN(x)) return;
      ctx.save();
      ctx.setLineDash([5,4]); ctx.strokeStyle = '#8b98a5'; ctx.lineWidth = 1.2; ctx.globalAlpha = .8;
      ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
      ctx.restore();
    });

    // 아직 손을 안 뗀, 드래그 중인 위치 미리보기(모드와 무관하게 항상 표시) — 확정된 비교 지점보다
    // 옅고 얇게 그려서, "여기서 손을 떼면 이 날짜가 찍힌다"는 걸 실시간으로 보여준다.
    if (previewDate != null) {
      const x = scales.x.getPixelForValue(new Date(previewDate).getTime());
      if (x != null && !isNaN(x)) {
        ctx.save();
        ctx.setLineDash([2,3]); ctx.strokeStyle = '#8b98a5'; ctx.lineWidth = 1; ctx.globalAlpha = .4;
        ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
        ctx.restore();
      }
    }

    // 비교 모드가 아닐 때 터치한 한 점: 가로+세로 십자선 + 점 + 값 상자
    if (singleMark) {
      const ds = chart.data.datasets[singleMark.datasetIndex];
      const pt = ds ? (ds.data || []).find(p => p.x === singleMark.date) : null;
      if (pt && pt.y != null) {
        const x = scales.x.getPixelForValue(new Date(singleMark.date).getTime());
        const y = scales.y.getPixelForValue(pt.y);
        if (x != null && !isNaN(x) && y != null && !isNaN(y)) {
          const color = ds.borderColor || '#8b98a5';
          ctx.save();
          ctx.setLineDash([5,4]); ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.globalAlpha = .8;
          ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(chartArea.left, y); ctx.lineTo(chartArea.right, y); ctx.stroke();
          ctx.restore();
          ctx.save();
          ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2); ctx.fill();
          ctx.strokeStyle = '#0e1116'; ctx.lineWidth = 1; ctx.stroke();
          ctx.restore();

          // 값 상자: 그 날짜에 표시 중인 모든 계좌의 값을 나열한다.
          // Chart.js 자체 툴팁은 껐고(설정에서 tooltip:{enabled:false}), 이 상자를
          // singleMark 상태로만 직접 그리기 때문에, 십자선이 꺼지면 이것도 항상 같이 꺼진다.
          const rows = chart.data.datasets
            .map(d => {
              const p = (d.data || []).find(p => p.x === singleMark.date);
              return (p && p.y != null) ? { label: d.label, color: d.borderColor, value: p.y } : null;
            })
            .filter(Boolean);
          if (rows.length) {
            const titleTxt = fmtYYMMDD(singleMark.date);
            const lineH = 18, padX = 10, padY = 8;
            ctx.font = '700 11px -apple-system,Segoe UI,sans-serif';
            let boxW = ctx.measureText(titleTxt).width;
            ctx.font = '600 11px -apple-system,Segoe UI,sans-serif';
            rows.forEach(r => { boxW = Math.max(boxW, ctx.measureText(`${r.label}: ${won(r.value)}원`).width + 18); });
            boxW += padX * 2;
            const boxH = lineH * (rows.length + 1) + padY * 2;
            let bx = x + 10;
            if (bx + boxW > chartArea.right) bx = x - boxW - 10;
            bx = Math.max(chartArea.left, Math.min(bx, chartArea.right - boxW));
            let by = Math.max(chartArea.top, Math.min(chartArea.top + 10, chartArea.bottom - boxH));

            ctx.save();
            ctx.fillStyle = 'rgba(15,20,28,.82)';
            ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.roundRect(bx, by, boxW, boxH, 8); ctx.fill(); ctx.stroke();

            ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
            ctx.fillStyle = '#e6edf3';
            ctx.font = '700 11px -apple-system,Segoe UI,sans-serif';
            ctx.fillText(titleTxt, bx + padX, by + padY + lineH / 2);

            ctx.font = '600 11px -apple-system,Segoe UI,sans-serif';
            rows.forEach((r, i) => {
              const ry = by + padY + lineH * (i + 1) + lineH / 2;
              ctx.fillStyle = r.color;
              ctx.fillRect(bx + padX, ry - 5, 10, 10);
              ctx.fillStyle = '#c9d1d9';
              ctx.fillText(`${r.label}: ${won(r.value)}원`, bx + padX + 16, ry);
            });
            ctx.restore();
          }
        }
      }
    }
  }
};

function renderHistoryChart(){
  const cv = document.getElementById('historyChart');
  if (!cv || !window.Chart) return;
  ensurePickedAccts();
  const history = DATA.history || [];

  let min = null, max = null;
  if (profitDateRange) {
    min = profitDateRange.from ? new Date(profitDateRange.from) : null;
    max = profitDateRange.to ? new Date(profitDateRange.to) : new Date();
  } else if (profitPreset) {
    max = new Date();
    min = new Date(max);
    if (profitPreset === '1m') min.setMonth(min.getMonth() - 1);
    else if (profitPreset === '3m') min.setMonth(min.getMonth() - 3);
    else if (profitPreset === '6m') min.setMonth(min.getMonth() - 6);
    else if (profitPreset === '1y') min.setFullYear(min.getFullYear() - 1);
  } else if (history.length) {
    // "전체" 상태일 때도 null로 자동 범위에 맡기지 않고, 실제 데이터의
    // 첫날·마지막날을 직접 계산해서 넘긴다 — 그래야 아래 여백 보정이
    // 전체 상태에서도 똑같이 적용된다(안 그러면 전체 상태만 계속 끝이 잘림).
    min = new Date(history[0].date);
    max = new Date(history[history.length-1].date);
  }
  // min/max가 실제 데이터의 첫날·마지막날과 정확히 겹치면 그 점이 축 경계에
  // 딱 붙어 잘려 보인다. 날짜 자체에 반나절 정도 여유를 준다.
  let xMin = min, xMax = max;
  if (xMin) { xMin = new Date(xMin); xMin.setHours(xMin.getHours() - 12); }
  if (xMax) { xMax = new Date(xMax); xMax.setHours(xMax.getHours() + 12); }

  const datasets = (DATA.accounts || [])
    .map((acc, i) => ({ acc, i }))
    .filter(({acc}) => pickedAccts[acc.id])
    .map(({acc, i}) => {
      const color = CHART_COLORS[i % CHART_COLORS.length];
      const data = history.map(r => ({ x: r.date, y: profitOf(r, acc) }));
      return { label: acc.name, data, borderColor: color, backgroundColor: color,
        tension: .25, pointRadius: 1, borderWidth: 1.3, spanGaps: true };
    });

  if (charts.historyChart) charts.historyChart.destroy();
  charts.historyChart = new Chart(cv, {
    type: 'line',
    data: { datasets },
    plugins: [comparePlugin],
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      events: [],   // Chart.js 자체 터치/호버 감지를 완전히 꺼서, 점선·값상자·점강조를 전부 우리 코드만 책임지게 한다(안 그러면 둘이 경쟁해서 간헐적으로 안 지워짐)
      layout: { padding: { left: 12, right: 12 } },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false }   // 자체 값 상자를 직접 그려서 점선과 항상 같은 상태로 묶는다
      },
      scales: {
        x: { type: 'time', min: xMin, max: xMax,
          time: { tooltipFormat: 'yyyy-MM-dd' },
          ticks: { color: '#5c6773', maxTicksLimit: 6, font: { size: 10 },
            callback: (val) => fmtYYMMDD(new Date(val).toISOString().slice(0,10)) },
          grid: { color: '#20272f' } },
        y: { ticks: { color: '#5c6773', font: { size: 10 }, callback: v => (v/1e6).toFixed(0)+'M' }, grid: { color: '#20272f' } }
      }
    }
  });

  // 손가락(또는 마우스)이 움직이는 동안 계속 가장 가까운 지점을 추적해두고,
  // 손을 떼는 순간(pointerup) 그 마지막 위치를 비교 지점으로 선택한다.
  // (드래그해서 값을 훑어보다가 원하는 곳에서 손을 떼는 동작과 자연스럽게 맞물림)
  // touch-action:pan-y 와 함께, 좌우 드래그를 브라우저가 스크롤로 가로채지
  // 않도록 preventDefault 도 걸어준다. 혹시 그래도 취소(pointercancel)되면
  // 그 시점까지 추적된 위치로라도 선택되게 한다.
  // (cv.onX = ... 형태로 덮어쓰기 방식을 써서, 이 함수가 같은 캔버스에 대해
  //  여러 번 다시 호출돼도 리스너가 중복으로 쌓이지 않게 한다)
  const chart = charts.historyChart;
  let lastHoverDate = null;      // 비교 모드용: 날짜만 있으면 충분
  let lastHoverPoint = null;     // 비교 모드 아닐 때(십자선)용: 어느 계좌의 어느 점인지까지 기억
  const trackHover = (evt) => {
    if (compareModeOn) {
      const points = chart.getElementsAtEventForMode(evt, 'index', {intersect:false}, true);
      if (points.length) {
        const pt = chart.data.datasets[points[0].datasetIndex].data[points[0].index];
        if (pt) lastHoverDate = pt.x;
      }
    } else {
      const points = chart.getElementsAtEventForMode(evt, 'nearest', {intersect:false}, true);
      if (points.length) {
        const p = points[0];
        const pt = chart.data.datasets[p.datasetIndex].data[p.index];
        if (pt) lastHoverPoint = { date: pt.x, datasetIndex: p.datasetIndex };
      }
    }
  };
  const selectFromHover = () => {
    previewDate = null;   // 어느 모드든, 확정되는 순간 미리보기 선은 끈다
    if (compareModeOn) {
      if (lastHoverDate == null) return;
      if (comparePoints.length === 0 || comparePoints.length === 2) comparePoints = [lastHoverDate];
      else comparePoints.push(lastHoverDate);
      renderCompareBox();
    } else if (singleMark) {
      singleMark = null;   // 십자선이 떠 있는 상태에서 다시 터치하면 해제(위치 무관)
      chart.tooltip.setActiveElements([], {x:0, y:0});   // Chart.js 자체 값 툴팁도 함께 닫음
      chart.setActiveElements([]);   // 점이 커져 보이는 강조 효과(hover 상태)도 함께 해제
      chart.update('none');
    } else {
      if (lastHoverPoint == null) return;
      singleMark = lastHoverPoint;   // 꺼져 있으면 이번에 터치한 점으로 표시
    }
    chart.draw();
  };
  const updatePreview = () => {
    previewDate = compareModeOn ? lastHoverDate : (lastHoverPoint ? lastHoverPoint.date : null);
    chart.draw();
  };
  cv.onpointerdown = (evt) => { trackHover(evt); evt.preventDefault(); updatePreview(); };
  cv.onpointermove = (evt) => {
    if (evt.pressure > 0 || evt.buttons > 0) {
      trackHover(evt); evt.preventDefault(); updatePreview();   // 드래그 중 실시간 미리보기(모드 공통)
    }
  };
  cv.onpointerup = selectFromHover;
  cv.onpointercancel = selectFromHover;
  updateCompareToggleUI();
  updateProfitPresetButtons();
}

function renderRatioChart(){
  const cv = document.getElementById('ratioChart');
  if (!cv || !window.Chart) return;
  const fx = (DATA.market && DATA.market.usdKrw) || 0;
  const settings = DATA.settings || {}, market = DATA.market || {};
  const names = [], cur = [], tgt = [], rate = [];
  (DATA.accounts || []).forEach(acc => {
    const r = computeAccount(acc, fx, settings, market);
    names.push(acc.name);
    cur.push(+(r.stockRatio*100).toFixed(1));
    tgt.push(r.tRatio != null ? +(r.tRatio*100).toFixed(1) : null);
    rate.push(r.profitRate != null ? +(r.profitRate*100).toFixed(2) : null);
  });

  if (charts.ratioChart) charts.ratioChart.destroy();
  charts.ratioChart = new Chart(cv, {
    type: 'bar',
    data: { labels: names, datasets: [
      { label: '현재 비중', data: cur, backgroundColor: '#4c8dff', yAxisID: 'y', barPercentage: .7, categoryPercentage: .62 },
      { label: '목표 비중', data: tgt, backgroundColor: '#c9a227', yAxisID: 'y', barPercentage: .7, categoryPercentage: .62 },
      { label: '수익률', data: rate, backgroundColor: '#e5484d', yAxisID: 'y1', barPercentage: .7, categoryPercentage: .62 },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8b98a5', boxWidth: 10, font: { size: 10 } } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (c.parsed.y!=null ? c.parsed.y.toFixed(1) : '-') + '%' } }
      },
      scales: {
        x: { ticks: { color: '#8b98a5', font: { size: 10 } }, grid: { display: false } },
        y: { position: 'left', min: 0, max: 100, ticks: { color: '#5c6773', font: { size: 9 }, callback: v => v+'%' }, grid: { color: '#20272f' } },
        y1: { position: 'right', ticks: { color: '#5c6773', font: { size: 9 }, callback: v => v+'%' }, grid: { drawOnChartArea: false } },
      }
    }
  });
}

// ==== 계좌별 섹터 비중 ====
let sectorChartAcct = null;   // 선택된 계좌명. null이면 첫 계좌로 기본 선택
function onSectorAcctSel(v){ sectorChartAcct = v; renderSectorChart(); }
function renderSectorAcctSel(){
  const sel = document.getElementById('sectorAcctSel');
  if (!sel) return;
  const accs = DATA.accounts || [];
  if (!sectorChartAcct || !accs.some(a => a.id === sectorChartAcct)) sectorChartAcct = accs[0] ? accs[0].id : null;
  sel.innerHTML = accs.map(a => `<option value="${esc(a.id)}" ${a.id===sectorChartAcct?'selected':''}>${esc(a.name)}</option>`).join('');
}

// PC 앱(renderSectorChart)과 동일한 로직:
// 목표 비중이 설정되고, 이 계좌에 실제로 보유한 섹터만 남긴 뒤
// 남은 섹터의 목표를 합 100%로 재정규화하고 목표 내림차순 정렬
function computeSectorRatios(acc, fx){
  const bySector = {};
  let stockTotal = 0;
  (acc.holdings || []).forEach(h => {
    const v = h.market === 'US' ? (h.qty||0)*(h.price||0)*fx : (h.qty||0)*(h.price||0);
    stockTotal += v;
    const key = h.sector || '(미지정)';
    bySector[key] = (bySector[key] || 0) + v;
  });

  const sectors = DATA.sectors || [];
  let present = sectors.filter(s => s.target != null && (bySector[s.name] || 0) > 0);
  const tgtSum = present.reduce((t,s) => t + (s.target||0), 0);
  present = present.map(s => ({
    name: s.name,
    target: tgtSum ? (s.target||0) / tgtSum * 100 : 0,
    cur: stockTotal ? (bySector[s.name]||0) / stockTotal * 100 : 0,
  })).sort((a,b) => b.target - a.target);

  return present;
}

function renderSectorChart(){
  const cv = document.getElementById('sectorChart');
  if (!cv || !window.Chart) return;
  const fx = (DATA.market && DATA.market.usdKrw) || 0;
  const acc = (DATA.accounts || []).find(a => a.id === sectorChartAcct);
  if (charts.sectorChart) { charts.sectorChart.destroy(); charts.sectorChart = null; }
  if (!acc) return;

  const present = computeSectorRatios(acc, fx);
  const emptyBox = document.getElementById('sectorChartEmpty');
  if (!present.length) {
    if (emptyBox) emptyBox.textContent = '이 계좌에 해당하는 섹터가 없습니다.';
    return;
  }
  if (emptyBox) emptyBox.textContent = '';

  const labels = present.map(s => {
    const d = s.cur - s.target;
    return `${s.name} (${d>=0?'+':''}${d.toFixed(1)}%)`;
  });
  const cur = present.map(s => s.cur);
  const tgt = present.map(s => s.target);

  charts.sectorChart = new Chart(cv, {
    type: 'bar',
    data: { labels, datasets: [
      { label: '현재 비중', data: cur, backgroundColor: '#4c8dff', barPercentage: .7, categoryPercentage: .62 },
      { label: '목표 비중', data: tgt, backgroundColor: '#c9a227', barPercentage: .7, categoryPercentage: .62 },
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#8b98a5', boxWidth: 10, font: { size: 10 } } },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y.toFixed(1) + '%' } }
      },
      scales: {
        x: { ticks: { color: '#8b98a5', font: { size: 9.5 } }, grid: { display: false } },
        y: { min: 0, ticks: { color: '#5c6773', font: { size: 9 }, callback: v => v+'%' }, grid: { color: '#20272f' } },
      }
    }
  });
}
