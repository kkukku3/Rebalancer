<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리밸런서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/date-fns/2.30.0/date_fns.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-adapter-date-fns/3.0.0/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --ink:#e6edf3; --muted:#8b98a5; --dim:#5c6773;
    --buy:#2ea043; --buywatch:#5bbf6a; --hold:#c9a227; --sellwatch:#e8834a; --sell:#e5484d;
    --accent:#4c8dff; --up:#e5484d; --down:#3fb950;
    --mono:'SF Mono',ui-monospace,'Cascadia Code','Roboto Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    font-size:14px;line-height:1.45}
  h1,h2,h3{margin:0;font-weight:650}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:6px}
  header h1{font-size:22px;letter-spacing:-.02em}
  header .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .toolbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    color:var(--ink);padding:8px 14px;border-radius:7px;transition:.12s}
  button:hover{border-color:var(--accent);background:#222d3a}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  button.btn-update{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  button.btn-save{background:var(--buy);border-color:var(--buy);color:#08150c;font-weight:600}
  button.primary:hover{background:#5b97ff}
  button.ghost{background:transparent}
  button.ghost.active{background:rgba(76,141,255,.16);border-color:var(--accent);color:var(--accent);font-weight:600}
  .status{font-size:12px;color:var(--muted);font-family:var(--mono);min-height:16px;margin:10px 0 4px}
  .status.warn{color:var(--sellwatch)} .status.ok{color:var(--down)}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 22px;flex-wrap:wrap}
  .tab{padding:10px 20px;cursor:default;color:var(--muted);border:1px solid transparent;
    border-bottom:none;border-radius:8px 8px 0 0;font-weight:600;position:relative;top:1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink);background:var(--panel);border-color:var(--line);border-bottom:1px solid var(--panel)}
  .tab.summary.active{color:var(--accent)}
  .tab.sector.active{color:#e8834a}
  .tab.virtual.active{color:#a371f7}
  .sector-wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  @media(max-width:820px){.sector-wrap{grid-template-columns:1fr}}
  .sector-col h3{margin:0 0 4px}
  .sector-hint{color:var(--dim);font-size:12px;margin:0 0 14px}
  .sector-add-row{display:flex;gap:8px;margin-bottom:14px}
  .sector-add-row input{flex:1;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);font:inherit;padding:9px 12px;border-radius:8px}
  .sector-list{display:flex;flex-direction:column;gap:8px}
  .sector-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:default}
  .sector-chip>span:first-child{flex:1}
  .sector-badge{font-size:11px;color:#e8834a;border:1px solid #e8834a;
    border-radius:999px;padding:1px 8px}
  .sector-del{color:var(--dim);cursor:pointer;font-size:12px}
  .sector-del:hover{color:var(--sell)}
  .sector-empty{color:var(--dim);font-size:13px;padding:20px;text-align:center;
    border:1px dashed var(--line);border-radius:10px}
  .sector-manage{min-height:120px;display:flex;flex-direction:column;gap:8px;
    border:1px dashed var(--line);border-radius:10px;padding:12px}
  .sector-manage-row{display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .sector-mname{flex:1;font-weight:600}
  .sector-manage-row input{width:70px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);font:inherit;text-align:right;padding:6px 8px;border-radius:6px}
  .sector-thresh{border-top:1px solid var(--line);margin-top:16px}
  .sector-thresh-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;
    color:var(--muted);font-size:13px}
  .sector-thresh-row input{width:64px;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);font:inherit;text-align:right;padding:6px 8px;border-radius:6px}
  .sector-dd{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:12px;padding:4px 6px;border-radius:6px;max-width:110px}
  .sector-cell{max-width:120px}
  .virtual-headright{display:flex;align-items:center;gap:10px}
  .virtual-time{font-size:12px;color:var(--dim)}
  .virtual-empty{color:var(--dim);font-size:13px;padding:30px;text-align:center;
    border:1px dashed var(--line);border-radius:10px}
  .vacct{margin-bottom:20px}
  .vacct-head{display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;margin-bottom:4px}
  .vtable{font-size:12px}
  .vtable th,.vtable td{padding:7px 8px}
  .vtable td:not(:first-child),.vtable th:not(:first-child){text-align:right}
  .vtotal{display:flex;justify-content:space-between;align-items:center;
    padding:14px 0 0;margin-top:6px;border-top:2px solid var(--line);
    font-size:15px;font-weight:700}
  .virtual-missing{color:var(--dim);font-size:12px;font-weight:400}
  .tab.tab-add{color:var(--muted);font-size:20px;font-weight:400;padding:10px 16px;cursor:pointer;
    line-height:1;display:inline-flex;align-items:center}
  .tab.tab-add:hover{background:var(--panel2);color:var(--ink)}
  .tab[draggable="true"]{cursor:default}
  .tab.dragging{opacity:.5}
  .tab-dirty{align-self:center;margin-left:10px;font-size:12px;color:var(--sellwatch);
    font-family:var(--mono)}

  .kronly{display:flex;align-items:center;gap:8px;margin-top:4px;cursor:pointer;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:fit-content}
  .kronly input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .kronly-hint{color:var(--dim);font-size:11px;font-weight:400}

  .acct-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;
    padding-top:16px;border-top:1px solid var(--line)}
  .btn-rename{background:var(--buy);border-color:var(--buy);color:#04140a;font-weight:600}
  .btn-rename:hover{background:#38b552;border-color:#38b552}
  .btn-delete{background:var(--sell);border-color:var(--sell);color:#1a0608;font-weight:600}
  .btn-delete:hover{background:#f2585d;border-color:#f2585d}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
    display:flex;align-items:center;justify-content:center}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:24px;min-width:320px;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-msg{font-size:15px;line-height:1.5;margin-bottom:18px}
  .modal-input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;margin-bottom:18px}
  .modal-input:focus{border-color:var(--accent);outline:none}
  .modal-btns{display:flex;gap:10px;justify-content:flex-end}
  .modal-cancel{background:transparent}
  .modal-ok{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
  .modal-danger{background:var(--sell);border-color:var(--sell);color:#1a0608;font-weight:600}
  .page{display:none} .page.active{display:block}

  .qqq-signals{margin-bottom:16px}
  .qqq-title{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px;
    display:flex;align-items:center;gap:10px}
  .qqq-grid8{display:grid;grid-template-columns:repeat(3,1fr) auto repeat(5,1fr);gap:8px;align-items:stretch}
  @media(max-width:900px){.qqq-grid8{grid-template-columns:repeat(3,1fr);}}
  .qqq-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 8px;text-align:center}
  .qqq-cell.comp.watch{background:rgba(214,197,74,.12);border-color:#d6c54a}
  .qqq-cell.comp.sell{background:rgba(232,131,74,.14);border-color:#e8834a}
  .qqq-cell.comp.strong{background:rgba(229,72,77,.16);border-color:#e5484d}
  .qqq-cell.comp{border-width:2px}
  .qqq-cell.comp .qqq-k{font-size:13px;color:var(--ink);font-weight:700}
  .qqq-cell.comp .qqq-v{font-size:15px}
  .qqq-cell.comp.none{border-color:#2ea043;background:rgba(46,160,67,.12)}
  .qqq-k{font-size:12px;color:var(--dim);margin-bottom:4px}
  .qqq-v{font-size:14px;font-weight:700;color:var(--ink)}
  .qqq-cell.watch .qqq-v{color:#e8a838}
  .qqq-cell.sell .qqq-v{color:#ff6b6f}
  .qqq-cell.strong .qqq-v{color:#ff6b6f}
  .qqq-cell.locked{opacity:.45}
  .qqq-cell.locked .qqq-v{color:var(--dim)}
  .has-tip{position:relative}
  .has-tip:hover::after{
    content:attr(data-tip);white-space:pre-line;position:absolute;
    left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);z-index:50;
    width:220px;padding:10px 12px;border-radius:8px;
    background:#0e1116;border:1px solid var(--line);color:var(--muted);
    font-size:11px;line-height:1.5;text-align:left;font-weight:400;
    box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none}
  .has-tip:hover::before{
    content:'';position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(100% + 2px);z-index:50;border:6px solid transparent;
    border-top-color:var(--line);pointer-events:none}
  .qqq-cell.comp.watch .qqq-v{color:#e5d46a}
  .qqq-cell.comp.sell .qqq-v{color:#f0a868}
  .qqq-cell.comp.strong .qqq-v{color:#ff6b6f}
  .qqq-cell.comp.none .qqq-v{color:#7ee2a0}
  .qqq-d{font-size:10px;color:var(--dim);margin-top:3px;min-height:12px}
  .trend-sel-wrap{display:flex;align-items:center}
  .trend-sel{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:12px;padding:3px 6px;border-radius:6px}
  .qqq-empty{font-size:12px;color:var(--dim);padding:8px}
  .market{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
  .market .cell{background:var(--panel);padding:12px 14px}
  .market .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .market .v{font-family:var(--mono);font-size:16px;margin-top:3px}
  .market .dd{font-size:12px;font-family:var(--mono);margin-top:2px}

  details.settings{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 16px;margin-bottom:22px}
  details.settings summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none}
  details.settings summary::-webkit-details-marker{display:none}
  details.settings summary::before{content:'▸ ';color:var(--accent)}
  details.settings[open] summary::before{content:'▾ '}
  .setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:4px 0 18px}
  .formula{border-top:1px solid var(--line);padding-top:14px;font-size:13px;line-height:2.1;color:var(--muted)}
  .formula-line{margin-bottom:2px}
  .formula-sub{font-size:11px;color:var(--dim);margin-bottom:12px;line-height:1.4}
  .fx-label{color:var(--ink);font-weight:600}
  .fx-val{color:var(--ink);font-family:var(--mono)}
  .fx-val.accent{color:var(--hold);font-size:15px}
  .fx-w{width:56px;background:var(--panel2);border:1px solid var(--line);color:var(--accent);
    font:inherit;font-weight:600;text-align:center;padding:3px 4px;border-radius:6px}
  .fx-btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;padding:1px 8px;color:var(--ink);font-family:var(--mono);font-size:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);padding:7px 9px;border-radius:6px}
  .hint{font-size:11px;color:var(--dim);margin-top:4px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
  .card h3{font-size:14px;color:var(--muted);margin-bottom:14px;font-weight:600}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-head h3{margin-bottom:0}
  .snap-btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;font-size:15px;cursor:pointer;line-height:1}
  .snap-btn:hover{border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:#c9d3de;font-weight:600;font-size:13px;letter-spacing:.02em}
  th:first-child,td:first-child{text-align:left}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--ink)}
  th.sorted{color:var(--accent)}
  .sort-arrow{font-size:9px}
  #summaryTable td.divider, #summaryTable th.divider{border-left:1px solid var(--line)}
  td.mono,.num{font-family:var(--mono)}
  .up{color:var(--up)} .down{color:var(--down)}
  .sig{font-weight:700;padding:3px 10px;border-radius:999px;font-size:12px;color:#08111a;display:inline-block}
  tfoot td{border-top:2px solid var(--line);border-bottom:none;font-weight:600;color:var(--ink)}

  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px}
  .chartbox .chart-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .hist-daterange{display:flex;align-items:center;gap:6px;margin:-6px 0 10px;flex-wrap:wrap}
  .hist-daterange.hidden{display:none}
  .hist-daterange input[type=text]{background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:5px 7px;font:inherit;font-size:12px;
    width:72px;text-align:center;letter-spacing:.05em}
  .hist-daterange span{color:var(--dim);font-size:12px}
  .chartbox h3{font-size:14px;color:var(--muted);font-weight:600}
  .picker{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .pie-select{margin-left:auto;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);font:inherit;font-size:13px;padding:6px 10px;border-radius:7px;cursor:pointer}
  .pie-select:focus{border-color:var(--accent);outline:none}
  .chip{padding:5px 13px;border-radius:999px;border:1px solid var(--line);cursor:pointer;
    font-size:12px;font-weight:600;color:var(--muted);user-select:none}
  .chip.on{color:#08111a}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:820px){.twocol{grid-template-columns:1fr}}
  .chartrow{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}
  @media(max-width:820px){.chartrow{grid-template-columns:1fr}}
  @media(max-width:820px){.chartrow-pie{grid-template-columns:1fr}}
  .chart-canvas{position:relative;height:285px}
  .chart-canvas-pie{height:285px}
  .chart-canvas-history{height:285px}
  .hist-compare{position:absolute;top:8px;right:8px;background:#1c232dee;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;
    min-width:150px;box-shadow:0 6px 20px rgba(0,0,0,.4);pointer-events:none}
  .hist-compare:empty{display:none}
  .hist-compare-title{color:var(--dim);font-size:11px;margin-bottom:6px}
  .hist-compare-row{display:flex;justify-content:space-between;gap:14px;padding:2px 0}
  .hist-compare-total{display:flex;justify-content:space-between;gap:14px;
    padding-top:6px;margin-top:6px;border-top:1px solid var(--line);font-weight:700}
  .chart-canvas canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
  .threecol{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
  @media(max-width:1100px){.threecol{grid-template-columns:1fr 1fr}}
  @media(max-width:720px){.threecol{grid-template-columns:1fr}}

  .acct-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .acct-head h2{font-size:19px}
  .badge{font-weight:700;padding:6px 14px;border-radius:999px;font-size:14px;color:#08111a}
  .metrics{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
  .metric{text-align:right}.metric .k{font-size:11px;color:var(--dim)}.metric .v{font-family:var(--mono);font-size:15px}
  .ratiobar{display:flex;align-items:center;gap:12px;margin:16px 0 6px;font-family:var(--mono);font-size:12px}
  .track{flex:1;height:22px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,#2b5fa8,var(--accent));border-radius:6px 0 0 6px}
  .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--hold)}
  .tgt::after{content:'목표';position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--hold);white-space:nowrap}
  .reco{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
  .reco .box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .reco .box .k{font-size:11px;color:var(--muted)}.reco .box .v{font-family:var(--mono);font-size:14px;margin-top:3px}
  .thgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 8px}
  .thgrid .field label{font-size:10px}.thgrid input{padding:5px 6px;font-size:12px}
  td input{width:100%;background:transparent;border:1px solid transparent;color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:4px 5px;border-radius:4px;text-align:right}
  td input:hover{border-color:var(--line)}
  td input:focus{border-color:var(--accent);background:var(--panel2);outline:none}
  td input.txt{text-align:left}.name-in input{text-align:left}
  tr.section td{background:var(--panel2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left}
  .row-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .row-add select,.row-add input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;padding:6px 8px;border-radius:6px}
  .del{color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:4px}.del:hover{color:var(--sell);background:#2a1a1c}

  /* account layout: reco left, thresholds right */
  .split{display:grid;grid-template-columns:1fr 300px;gap:20px;margin:16px 0 4px;align-items:start}
  @media(max-width:820px){.split{grid-template-columns:1fr}}
  .marketrow{display:flex;flex-direction:column;gap:10px}
  .mkt-box{display:flex;align-items:center;gap:14px;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .mkt-tag{font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;
    border:1px solid;background:var(--bg);flex-shrink:0}
  .mkt-amt{display:flex;gap:18px;flex:1;flex-wrap:wrap}
  .mkt-amt>div{display:flex;flex-direction:column;gap:3px}
  .mkt-amt .k{font-size:11px;color:var(--muted)}
  .mkt-amt .v{font-family:var(--mono);font-size:15px}
  .mkt-sig{display:flex;align-items:center;gap:12px;flex-shrink:0;margin-left:auto}
  .mkt-sig .gapr{font-family:var(--mono);font-size:15px;font-weight:600;min-width:64px;text-align:right}
  .mkt-sig .gapr-label{font-size:11px;color:var(--muted)}
  .mkt-sig .sig{font-weight:700;padding:5px 13px;border-radius:999px;font-size:13px;color:#08111a}
  .th-col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .th-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:12px}
  .th-title span{font-size:12px;color:var(--dim);font-weight:400}
  .th-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .th-row label{flex:1;font-size:13px;color:var(--muted)}
  .th-row input{width:90px;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:6px 8px;border-radius:6px;text-align:right}
  .th-row input:focus{border-color:var(--accent);outline:none}

  /* logo / avatar in name cell */
  .namecell{display:flex;align-items:center;gap:9px}
  .logo{width:22px;height:22px;border-radius:5px;object-fit:contain;background:#fff;flex-shrink:0}
  .avatar{width:22px;height:22px;border-radius:5px;flex-shrink:0;display:inline-flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:700;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line)}

  /* percent inputs */
  .pctwrap{position:relative;display:flex;align-items:center}

  .pctsign{position:absolute;right:10px;color:var(--dim);font-family:var(--mono);font-size:13px;pointer-events:none}
  .th-row .pctwrap{width:90px}
  .th-row .pctwrap input{width:90px}

  /* holding groups */
  tr.grp td{background:#131922;color:var(--ink);font-weight:600;font-size:12px;

</head>
<body>
<div class="wrap">
  <header>
    <h1>리밸런서</h1>
    <span class="sub" id="fileinfo">loading…</span>
    <div class="toolbar">
      <button class="btn-update" onclick="refresh()">Update</button>
      <button class="ghost" onclick="reauthKey(this)">키 재인증</button>
      <button class="btn-save" onclick="saveNow(this)">저장</button>
    </div>
  </header>
  <div class="status" id="status">불러오는 중…</div>

  <div class="tabs" id="tabs"></div>

  <div class="page active" id="page-summary">
    <div id="qqqSignals" class="qqq-signals"></div>
    <div class="market" id="market"></div>
    <details class="settings" id="settingsBox">
      <summary>전략 설정 (전역)</summary>
      <div class="setgrid" id="setgrid"></div>
      <div class="formula" id="formulaBox"></div>
    </details>

    <div class="card">
      <div class="card-head">
        <h3>계좌 현황</h3>
        <button class="snap-btn" id="snapBtn" onclick="captureSnapshot()" title="가상 계산용 기록 남기기">📸</button>
      </div>
      <table id="summaryTable"></table>
    </div>

    <div class="chartrow">
      <div class="chartbox">
        <div class="chart-head">
          <h3>수익 금액</h3>
          <div class="picker" id="picker"></div>
          <button class="ghost" onclick="toggleHistDatePanel()">기간</button>
        </div>
        <div class="hist-daterange hidden" id="histDatePanel">
          <input type="text" id="histDateFrom" maxlength="6" inputmode="numeric" placeholder="YYMMDD">
          <span>~</span>
          <input type="text" id="histDateTo" maxlength="6" inputmode="numeric" placeholder="YYMMDD">
          <button class="ghost" onclick="resetHistDateRange()">전체</button>
          <button class="ghost" onclick="applyHistDateRange()">적용</button>
        </div>
        <div class="chart-canvas chart-canvas-history">
          <canvas id="historyChart"></canvas>
          <div id="historyCompare" class="hist-compare"></div>
        </div>
      </div>
      <div class="chartbox"><h3 style="margin-bottom:12px">주식 비중 및 수익률</h3>

    </div>

    <div class="chartrow chartrow-pie">
      <div class="chartbox">

      </div>
      <div class="chartbox">
        <div class="chart-head">
          <h3>계좌별 섹터 비중</h3>
          <select class="pie-select" id="sectorChartSelect" onchange="onSectorChartSelect(this.value)"></select>
        </div>
        <div class="chart-canvas"><canvas id="sectorChart"></canvas></div>
      </div>
    </div>
  </div>

  <div class="page" id="page-sector">
    <div class="sector-wrap">
      <div class="sector-col">
        <h3>섹터 목록</h3>
        <p class="sector-hint">섹터를 추가하고, 아래 '섹터 관리'로 끌어다 놓아 비중을 설정하세요.</p>
        <div class="sector-add-row">
          <input id="sectorNewName" placeholder="섹터 이름 (예: 반도체)" onkeydown="if(event.key==='Enter')addSector()">
          <button onclick="addSector()">＋ 섹터 추가</button>
        </div>
        <div id="sectorList" class="sector-list"></div>
      </div>
      <div class="sector-col">
        <h3>섹터별 목표 가중치</h3>
        <p class="sector-hint">위 목록에서 섹터를 이 영역으로 드래그하면 추가됩니다.</p>
        <div id="sectorManage" class="sector-manage"
          ondragover="event.preventDefault()" ondrop="dropToManage(event)"></div>
        <div class="sector-thresh">
          <h3 style="margin:18px 0 10px">비중 임계값</h3>

              onchange="setSectorThresh('reduce',this.value)"><span>%</span>

  <div class="page" id="page-virtual">

          <span id="virtualTime" class="virtual-time"></span>
          <button class="btn-update" id="virtualSimBtn" onclick="runSimulation(this)">Simulation</button>
          <button class="snap-btn" id="virtualClearBtn" onclick="clearSnapshot()">기록 지우기</button>
        </div>

  <div id="acctPages"></div>

<script>
let DATA=null, charts={}, saveTimer=null, activeTab='summary';
let picked={};
let pieName=null;
let tabsDirty=false;      // 탭 구조 변경 후 시세 갱신 전이면 true
let sortState={};         // 계좌별 정렬 상태 {ai:{key,dir}}
let sectorDrag=null;      // 드래그 중인 섹터 이름

const won = n => (n==null||isNaN(n))?'-':Math.round(n).toLocaleString('ko-KR');
const pct = n => (n==null||isNaN(n))?'-':(n*100).toFixed(2)+'%';
const signPct = n => (n>=0?'+':'')+pct(n);
const num = (n,d=2)=> (n==null||isNaN(n))?'-':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d});
const numFixed = (n,d)=> (n==null||isNaN(n))?'-':Number(n).toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
const COLORS=['#4c8dff','#e8834a','#3fb950','#c9a227','#a371f7','#f778ba'];

async function boot(){
  const r=await fetch('/api/data'); DATA=await r.json();
  document.getElementById('fileinfo').textContent='data/portfolio.json';
  DATA.accounts.forEach(a=>{ if(picked[a.name]===undefined) picked[a.name]=true; });
  buildTabs(); render();
  if(histDateRange){
    const f=document.getElementById('histDateFrom'); if(f) f.value=isoToYYMMDD(histDateRange.from);
    const t=document.getElementById('histDateTo'); if(t) t.value=isoToYYMMDD(histDateRange.to);
    applyHistZoomFromRange();
  }
  if(DATA._driveLastModified){
    const d=new Date(DATA._driveLastModified);
    setStatus('마지막 저장 · '+d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),'ok');
  } else {
    setStatus('불러왔습니다.','ok');
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});
    setStatus('저장됨 · '+new Date().toLocaleTimeString('ko-KR'),'ok');
  },600);
}
function setStatus(m,c=''){const s=document.getElementById('status');s.textContent=m;s.className='status '+c;}

// ---- 모달 (확인 팝업 / 이름 입력) ----
function closeModal(){ const m=document.getElementById('modal'); if(m) m.remove(); }
// ---- 추세 신호 칸 클릭 시: 점수 추이 팝업 ----
const trendThresholdLines={
  id:'trendThresholdLines',
  afterDatasetsDraw(chart){
    const {ctx,chartArea,scales}=chart;
    const y=scales.y; if(!y) return;
    [[40,'매도 고려'],[70,'매도']].forEach(([val,label])=>{
      const py=y.getPixelForValue(val);
      ctx.save();
      ctx.setLineDash([5,4]); ctx.strokeStyle='#e5484d'; ctx.lineWidth=1.2; ctx.globalAlpha=.75;
      ctx.beginPath(); ctx.moveTo(chartArea.left,py); ctx.lineTo(chartArea.right,py); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      ctx.fillStyle='#e5484d'; ctx.font='10px sans-serif'; ctx.textBaseline='bottom';
      ctx.fillText(label+' '+val, chartArea.left+4, py-2);
      ctx.restore();
    });
  }
};
let trendPopupPreset=null;   // '3m'|'6m'|'1y'|'all' — null이면 커스텀 지정(trendPopupDateRange) 우선
try{ trendPopupPreset=localStorage.getItem('trendPopupPreset')||null; }catch(e){}
let trendPopupDateRange=null;
try{ trendPopupDateRange=JSON.parse(localStorage.getItem('trendPopupDateRange'))||null; }catch(e){}
let trendPopupCurrentSym=null;

function toggleTrendDatePanel(){
  const panel=document.getElementById('trendDatePanel');
  if(panel) panel.classList.toggle('hidden');
}
function setTrendPreset(preset){
  trendPopupPreset=preset;
  trendPopupDateRange=null;   // 프리셋을 고르면 커스텀 지정은 해제
  try{
    localStorage.setItem('trendPopupPreset', preset);
    localStorage.removeItem('trendPopupDateRange');
  }catch(e){}
  const f=document.getElementById('trendDateFrom'); if(f) f.value='';
  const t=document.getElementById('trendDateTo'); if(t) t.value='';
  renderTrendPopupBody();
}
function applyTrendDateRange(){
  const fromIso=yymmddToISO(document.getElementById('trendDateFrom').value);
  const toIso=yymmddToISO(document.getElementById('trendDateTo').value);
  trendPopupDateRange=(fromIso||toIso)?{from:fromIso,to:toIso}:null;
  trendPopupPreset=null;   // 커스텀 지정을 적용하면 프리셋 선택은 해제
  try{
    localStorage.setItem('trendPopupDateRange', JSON.stringify(trendPopupDateRange));
    localStorage.removeItem('trendPopupPreset');
  }catch(e){}
  renderTrendPopupBody();
}

// 지금 상태(프리셋 또는 커스텀 지정)로부터 x축 최소·최대(Date)와 표시용 라벨을 계산
function trendPopupRangeBounds(){
  const today=new Date();
  if(trendPopupDateRange){
    const min=trendPopupDateRange.from?new Date(trendPopupDateRange.from):null;
    const max=trendPopupDateRange.to?new Date(trendPopupDateRange.to):today;
    return {min,max,label:'지정 기간'};
  }
  const preset=trendPopupPreset||'3m';
  const max=today;
  let min=new Date(today);
  if(preset==='3m') min.setMonth(min.getMonth()-3);
  else if(preset==='6m') min.setMonth(min.getMonth()-6);
  else if(preset==='1y') min.setFullYear(min.getFullYear()-1);
  else if(preset==='all') min=null;
  const labelMap={'3m':'최근 3개월','6m':'최근 6개월','1y':'최근 1년','all':'전체 기간'};
  return {min,max,label:labelMap[preset]||'최근 3개월'};
}
function updateTrendPresetButtons(){
  const active=trendPopupDateRange?null:(trendPopupPreset||'3m');
  document.querySelectorAll('#trendPresetRow button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.preset===active);
  });
}

function showTrendHistoryPopup(sym){
  closeModal();
  trendPopupCurrentSym=sym;

  const el=document.createElement('div'); el.id='modal'; el.className='modal-overlay';
  el.innerHTML=`<div class="modal-box" style="min-width:340px;max-width:560px;width:92vw">
    <div class="modal-msg" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b id="trendPopupTitle">${sym} 추세 점수</b>
      <span style="display:flex;align-items:center;gap:10px">
        <span style="font-size:12px;color:var(--dim);cursor:pointer" onclick="toggleTrendDatePanel()">직접 지정</span>
        <span style="font-size:13px;color:var(--dim);cursor:pointer" onclick="closeModal()">✕</span>
      </span>
    </div>
    <div id="trendPresetRow" style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">
      <button class="ghost" data-preset="3m" onclick="setTrendPreset('3m')">3개월</button>
      <button class="ghost" data-preset="6m" onclick="setTrendPreset('6m')">6개월</button>
      <button class="ghost" data-preset="1y" onclick="setTrendPreset('1y')">1년</button>
      <button class="ghost" data-preset="all" onclick="setTrendPreset('all')">전체</button>
    </div>
    <div class="hist-daterange hidden" id="trendDatePanel">
      <input type="text" id="trendDateFrom" maxlength="6" inputmode="numeric" placeholder="YYMMDD"
        value="${trendPopupDateRange?isoToYYMMDD(trendPopupDateRange.from):''}">
      <span>~</span>
      <input type="text" id="trendDateTo" maxlength="6" inputmode="numeric" placeholder="YYMMDD"
        value="${trendPopupDateRange?isoToYYMMDD(trendPopupDateRange.to):''}">
      <button class="ghost" onclick="applyTrendDateRange()">적용</button>
    </div>
    <div id="trendPopupBody"></div>
  </div>`;
  el.addEventListener('click',e=>{ if(e.target===el) closeModal(); });
  document.body.appendChild(el);

  renderTrendPopupBody();
}

function renderTrendPopupBody(){
  const sym=trendPopupCurrentSym;
  const arr=(DATA.trendHistory&&DATA.trendHistory[sym])||[];
  const {min,max,label}=trendPopupRangeBounds();

  const titleEl=document.getElementById('trendPopupTitle');
  if(titleEl) titleEl.textContent=`${sym} 추세 점수 (${label})`;
  updateTrendPresetButtons();

  const body=document.getElementById('trendPopupBody');
  if(!body) return;

  const minTime=min?min.getTime():-Infinity;
  const hasData=arr.some(r=>{
    const t=new Date(r.date).getTime();
    return t>=minTime && t<=max.getTime();
  });

  if(!hasData){
    body.innerHTML=`<div style="text-align:center;color:var(--dim);font-size:13px;padding:30px 0">
      이 기간에 기록된 점수가 없습니다. Update나 자동화가 돌면 하루 단위로 쌓입니다.</div>`;
    return;
  }
  body.innerHTML=`<div style="height:280px;position:relative"><canvas id="trendHistChart"></canvas></div>
    <div style="font-size:11px;color:var(--dim);margin-top:10px">빨간 점선: 매도 고려(40점) · 매도(70점) 기준선</div>`;

  const cv=document.getElementById('trendHistChart');
  if(charts['trendHistChart']) charts['trendHistChart'].destroy();
  charts['trendHistChart']=new Chart(cv,{
    type:'line',
    data:{datasets:[{
      label:sym+' 점수', data:arr.map(r=>({x:r.date,y:r.score})),
      borderColor:'#4c8dff', backgroundColor:'#4c8dff', tension:.25, pointRadius:2, spanGaps:true
    }]},
    plugins:[trendThresholdLines],
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.parsed.y+'점'}} },
      scales:{
        x:{type:'time',min,max,
          time:{tooltipFormat:'yyyy-MM-dd',displayFormats:{day:'MM-dd',week:'MM-dd',month:'yyyy-MM'}},
          ticks:{color:'#5c6773',maxTicksLimit:8},grid:{color:'#20272f'}},
        y:{min:0,max:100,ticks:{color:'#5c6773'},grid:{color:'#20272f'}}
      }
    }
  });
}

function showConfirm(msgHtml, okLabel, onOk, danger){
  closeModal();
  const el=document.createElement('div'); el.id='modal'; el.className='modal-overlay';
  el.innerHTML=`<div class="modal-box">
    <div class="modal-msg">${msgHtml}</div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">취소</button>
      <button class="${danger?'modal-danger':'modal-ok'}" id="modalOk">${okLabel}</button>
    </div></div>`;
  el.addEventListener('click',e=>{ if(e.target===el) closeModal(); });
  document.body.appendChild(el);
  document.getElementById('modalOk').onclick=()=>{ closeModal(); onOk&&onOk(); };
}
function showPrompt(title, initial, onOk){
  closeModal();
  const el=document.createElement('div'); el.id='modal'; el.className='modal-overlay';
  el.innerHTML=`<div class="modal-box">
    <div class="modal-msg">${title}</div>
    <input id="modalInput" class="modal-input" value="${(initial||'').replace(/"/g,'&quot;')}">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">취소</button>
      <button class="modal-ok" id="modalOk">확인</button>
    </div></div>`;
  el.addEventListener('click',e=>{ if(e.target===el) closeModal(); });
  document.body.appendChild(el);
  const inp=document.getElementById('modalInput');
  inp.focus(); inp.select();
  const go=()=>{ const v=inp.value; closeModal(); onOk&&onOk(v); };
  document.getElementById('modalOk').onclick=go;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); if(e.key==='Escape') closeModal(); });
}

async function saveNow(btn){
  clearTimeout(saveTimer);
  const old=btn.textContent;
  btn.disabled=true; btn.textContent='저장 중…';
  setStatus('저장하는 중…');
  try{
    await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});
    setStatus('저장 완료 · '+new Date().toLocaleTimeString('ko-KR'),'ok');
  }catch(e){ setStatus('저장 실패: '+e,'warn'); }
  btn.disabled=false; btn.textContent=old;
}

async function reauthKey(btn){
  const old=btn.textContent;
  btn.disabled=true; btn.textContent='재인증 중…';
  setStatus('브라우저에서 뜨는 구글 로그인 창을 확인해주세요…');
  try{
    const j=await(await fetch('/api/reauth_key',{method:'POST'})).json();
    if(j.ok) setStatus('키 재인증 완료 · 깃허브에 등록됨 · '+new Date().toLocaleTimeString('ko-KR'),'ok');
    else setStatus('재인증 실패: '+j.error,'warn');
  }catch(e){ setStatus('재인증 실패: '+e,'warn'); }
  btn.disabled=false; btn.textContent=old;
}

async function refresh(){
  setStatus('시세를 가져오는 중…');
  // 진행 상황을 주기적으로 조회해 표시
  let polling=true;
  const poll=async()=>{
    while(polling){
      try{
        const p=await(await fetch('/api/refresh_progress')).json();
        if(polling && p && p.stage){
          const cnt=(p.total>0)?` (${p.done}/${p.total})`:'';
          setStatus(`시세를 가져오는 중… ${p.stage}${cnt}`);
        }
      }catch(e){}
      await new Promise(r=>setTimeout(r,400));
    }
  };
  poll();
  try{
    // 탭 편집 등 현재 상태를 먼저 확실히 저장한 뒤 갱신 (서버가 이 파일을 읽음)
    clearTimeout(saveTimer);
    await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DATA)});
    const j=await(await fetch('/api/refresh',{method:'POST'})).json();
    DATA=j.data;
    // 시세 갱신 직후 오늘 수익을 자동 기록
    try{
      const jr=await(await fetch('/api/record',{method:'POST'})).json();
      if(jr&&jr.data) DATA=jr.data;
    }catch(e){}
    tabsDirty=false;
    polling=false;
    render();
    if(j.warnings&&j.warnings.length) setStatus('일부 실패: '+j.warnings.join(' / '),'warn');
    else setStatus('업데이트 완료 · '+new Date().toLocaleTimeString('ko-KR'),'ok');
  }catch(e){ polling=false; setStatus('갱신 실패: '+e,'warn'); }
}

function sectorWeights(){
  const s=DATA.settings;
  return {nw:(s.nasdaqWeight!=null?s.nasdaqWeight:0.85),
          kw:(s.kospiWeight!=null?s.kospiWeight:0.25)};
}
function weightedDrop(){
  const m=DATA.market;
  const kd=m.kospiHigh?(m.kospiNow-m.kospiHigh)/m.kospiHigh:0;
  const nd=m.nasdaqHigh?(m.nasdaqNow-m.nasdaqHigh)/m.nasdaqHigh:0;
  const {nw,kw}=sectorWeights();
  return nd*nw+kd*kw;
}
function targetRatio(){
  const s=DATA.settings;
  const w=weightedDrop();
  return Math.min(1,s.peakStockRatio-(1-s.peakStockRatio)*w/s.maxDrawdownAssumption);
}
function computeAccount(acc){
  const m=DATA.market,fx=m.usdKrw||0;
  let kr=0,us=0;
  (acc.holdings||[]).forEach(h=>{const v=(h.qty||0)*(h.price||0); if(h.market==='US')us+=v*fx; else kr+=v;});
  const cash=(acc.cashKRW||0)+(acc.cashUSD||0)*fx;
  const total=kr+us+cash;
  const stockRatio=total?(kr+us)/total:0;
  const tRatio=targetRatio(), gap=stockRatio-tRatio;
  // 국장 Only 계좌는 국장 목표 배분을 100%로 산정
  const domRatio=acc.krOnly?1:DATA.settings.domesticTargetRatio;
  const recKR=total*tRatio*domRatio;
  const recUS=total*tRatio*(1-domRatio);
  // 국장/미장 각각의 괴리율 = 현재 비중 − 목표 비중 (총자산 대비)
  const krRatio=total?kr/total:0, usRatio=total?us/total:0;
  const krTargetRatio=tRatio*domRatio;
  const usTargetRatio=tRatio*(1-domRatio);
  const krGapRatio=krRatio-krTargetRatio, usGapRatio=usRatio-usTargetRatio;
  // 달러 매수 필요액 (원본 Summary!K5)
  // = MAX( ((미장 부족분/환율) - 보유 달러) * 환율 , 0 )
  const usShortfall=recUS-us;                       // 미장이 권장액보다 부족한 금액(원화)
  const usdNeed = fx>0
    ? Math.max(((usShortfall/fx)-(acc.cashUSD||0))*fx, 0)
    : 0;
  return {kr,us,cash,total,stockRatio,tRatio,gap,krOnly:!!acc.krOnly,usdNeed,
    profit:total-(acc.seed||0), profitRate:acc.seed?(total-acc.seed)/acc.seed:0,
    recKR,recUS,krGap:kr-recKR,usGap:us-recUS,signal:signalOf(gap,acc.thresholds),
    krGapRatio,usGapRatio,
    krSignal:signalOf(krGapRatio,acc.thresholds),
    usSignal:signalOf(usGapRatio,acc.thresholds)};
}
function signalOf(gap,t){
  if(gap>=t.sell)return{label:'매도',color:'var(--sell)'};
  if(gap>=t.sellWatch)return{label:'매도 고민',color:'var(--sellwatch)'};
  if(gap>=t.buyWatch)return{label:'관망',color:'var(--hold)'};
  if(gap>=t.buy)return{label:'매수 고민',color:'var(--buywatch)'};
  return{label:'매수',color:'var(--buy)'};
}

function ensureSectors(){
  if(!DATA.sectors) DATA.sectors=[];
  if(!DATA.sectorThresh) DATA.sectorThresh={reduce:5, expand:-5};
}
function setSectorThresh(k,v){
  ensureSectors();
  DATA.sectorThresh[k]=parseFloat(v)||0;   // 확대 기준은 음수 허용
  scheduleSave(); renderSectorChart();
}
function addSector(){
  ensureSectors();
  const inp=document.getElementById('sectorNewName');
  const name=(inp.value||'').trim();
  if(!name) return;
  if(DATA.sectors.some(s=>s.name===name)){ setStatus('이미 있는 섹터입니다','warn'); return; }
  DATA.sectors.push({name, target:null});   // target null = 관리에 아직 안 올림
  inp.value='';
  renderSector(); renderAccounts(); scheduleSave();
}
function deleteSector(name){
  ensureSectors();
  showConfirm(`'${name}' 섹터를 삭제할까요?<br><span style="color:var(--dim);font-size:12px">이 섹터가 할당된 종목은 '미지정'으로 바뀝니다.</span>`,'삭제',()=>{
    DATA.sectors=DATA.sectors.filter(s=>s.name!==name);
    DATA.accounts.forEach(a=>(a.holdings||[]).forEach(h=>{ if(h.sector===name) h.sector=''; }));
    renderSector(); renderAccounts(); scheduleSave();
  }, true);
}
function sectorDragStart(e,name){ sectorDrag=name; e.dataTransfer.effectAllowed='copy'; }
function dropToManage(e){
  e.preventDefault();
  if(!sectorDrag) return;
  const s=DATA.sectors.find(x=>x.name===sectorDrag);
  if(s && (s.target==null)) s.target=0;   // 관리에 올림 (기본 0%)
  sectorDrag=null;
  renderSector(); scheduleSave();
}
function setSectorTarget(name,val){
  const s=DATA.sectors.find(x=>x.name===name);
  if(s){ s.target=Math.max(0,Math.min(100,parseFloat(val)||0)); scheduleSave(); renderSector(); }
}
function removeFromManage(name){
  const s=DATA.sectors.find(x=>x.name===name);
  if(s){ s.target=null; renderSector(); scheduleSave(); }
}
function renderSector(){
  ensureSectors();
  // 섹터 목록 (드래그 소스, 더블클릭 시 이름 수정)
  const list=document.getElementById('sectorList');
  if(list){
    list.innerHTML=DATA.sectors.length
      ? DATA.sectors.map(s=>`<div class="sector-chip" draggable="true"
          ondragstart="sectorDragStart(event,'${s.name.replace(/'/g,"\\'")}')"
          ondblclick="renameSector('${s.name.replace(/'/g,"\\'")}')" title="더블클릭하여 이름 수정">
          <span>${s.name}</span>
          ${s.target!=null?'<span class="sector-badge">관리중</span>':''}
          <span class="sector-del" onclick="deleteSector('${s.name.replace(/'/g,"\\'")}')">✕</span>
        </div>`).join('')
      : `<div class="sector-empty">아직 섹터가 없습니다.</div>`;
  }
  // 섹터별 목표 가중치 (비중 내림차순 정렬)
  const man=document.getElementById('sectorManage');
  if(man){
    const inManage=DATA.sectors.filter(s=>s.target!=null)
      .slice().sort((a,b)=>(b.target||0)-(a.target||0));
    man.innerHTML=inManage.length
      ? inManage.map(s=>`<div class="sector-manage-row">
          <span class="sector-mname">${s.name}</span>
          <input type="number" min="0" max="100" step="0.1" value="${s.target}"
            onchange="setSectorTarget('${s.name.replace(/'/g,"\\'")}',this.value)"><span>%</span>
          <span class="sector-del" onclick="removeFromManage('${s.name.replace(/'/g,"\\'")}')">✕</span>
        </div>`).join('')
      : `<div class="sector-empty">여기로 섹터를 끌어다 놓으세요.</div>`;
  }
  const tr=document.getElementById('threshReduce'), te=document.getElementById('threshExpand');
  if(tr) tr.value=DATA.sectorThresh.reduce;
  if(te) te.value=DATA.sectorThresh.expand;
  renderSectorChart();   // Summary의 계좌별 섹터 비중도 함께 갱신
}
function renameSector(oldName){
  ensureSectors();
  showPrompt('섹터 이름 수정', oldName, (val)=>{
    const nn=(val||'').trim();
    if(!nn || nn===oldName) return;
    if(DATA.sectors.some(s=>s.name===nn)){ setStatus('이미 있는 섹터입니다','warn'); return; }
    const s=DATA.sectors.find(x=>x.name===oldName);
    if(s) s.name=nn;
    // 종목에 할당된 섹터명도 함께 변경 (개인 계좌 연동)
    DATA.accounts.forEach(a=>(a.holdings||[]).forEach(h=>{ if(h.sector===oldName) h.sector=nn; }));
    renderSector(); renderAccounts(); scheduleSave();
  });
}

function renderFormula(){
  const box=document.getElementById('formulaBox');
  if(!box) return;
  const s=DATA.settings, m=DATA.market;
  const {nw,kw}=sectorWeights();
  const kd=m.kospiHigh?(m.kospiNow-m.kospiHigh)/m.kospiHigh:0;
  const nd=m.nasdaqHigh?(m.nasdaqNow-m.nasdaqHigh)/m.nasdaqHigh:0;
  const w=weightedDrop();
  const tr=targetRatio();
  const peak=s.peakStockRatio, dd=s.maxDrawdownAssumption;
  const pct=x=>(x*100).toFixed(1)+'%';
  box.innerHTML=`
    <div class="formula-line">
      <span class="fx-label">가중하락률</span> =
      나스닥하락 ×
      <input class="fx-w" type="number" step="0.01" value="${nw}" onchange="setWeight('nasdaqWeight',this.value)">
      + 코스피하락 ×
      <input class="fx-w" type="number" step="0.01" value="${kw}" onchange="setWeight('kospiWeight',this.value)">
      = <b class="fx-val">${pct(w)}</b>
    </div>
    <div class="formula-sub">(현재 나스닥 ${pct(nd)}, 코스피 ${pct(kd)})</div>
    <div class="formula-line">
      <span class="fx-label">권장 주식 비중</span> =
      MIN(1, <span class="fx-btn">${pct(peak)}</span>
      + (1 − <span class="fx-btn">${pct(peak)}</span>) × (−가중하락률) ÷ <span class="fx-btn">${pct(dd)}</span>)
      = <b class="fx-val accent">${pct(tr)}</b>
    </div>
    <div class="formula-sub">고점비중·최대낙폭은 위 전략 설정값이 반영됩니다.</div>`;
}

    `나스닥·코스피 가중 수치는 목표 주식 비중을 결정하는 핵심 값입니다. `+

    `<b>충분히 신중하게 검토한 경우에만 변경하세요.</b><br>정말 변경하시겠습니까?`,

function sortHoldings(ai,key){

function holdingsSortVal(x,key,fx){
  const h=x.h, price=h.price||0, avg=h.avgPrice||0;
  switch(key){
    case 'code': return (h.code||'').toString();
    case 'sector': return (h.sector||'').toString();
    case 'name': return (h.name||'').toString();
    case 'qty':  return h.qty||0;
    case 'avg':  return avg;
    case 'price':return price;
    case 'ret':  return avg?(price-avg)/avg:-Infinity;
    case 'eval': return h.market==='US'?(h.qty||0)*price*fx:(h.qty||0)*price;
    default: return 0;
  }
}
function applySort(ai,items,fx){
  const st=sortState[ai]; if(!st) return items;
  const arr=items.slice();
  arr.sort((a,b)=>{
    const va=holdingsSortVal(a,st.key,fx), vb=holdingsSortVal(b,st.key,fx);
    let c;
    if(typeof va==='string'||typeof vb==='string') c=String(va).localeCompare(String(vb),'ko');
    else c=va-vb;
    return c*st.dir;
  });
  return arr;
}

function logoHtml(h,ai,hi){
  const letter=(h.name||h.code||'?').trim().charAt(0);
  const list=(h.logos&&h.logos.length)?h.logos:(h.logo?[h.logo]:[]);
  if(!list.length) return `<span class="avatar">${letter}</span>`;
  // 후보 주소를 순서대로 시도하고, 모두 실패하면 첫 글자 아바타로 대체
  const json=JSON.stringify(list).replace(/"/g,'&quot;');
  const idAttrs=(ai!=null&&hi!=null)?`data-ai="${ai}" data-hi="${hi}"`:'';
  const clickAttr=(ai!=null&&hi!=null)?`onclick="logoCycle(this)" title="클릭: 다음 후보 로고" style="cursor:pointer"`:'';
  return `<img class="logo" src="${list[0]}" alt=""
    data-cands="${json}" data-i="0" data-letter="${letter}" ${idAttrs} ${clickAttr}
    onerror="logoFallback(this)">`;
}
function logoCycle(img){
  let list=[]; try{ list=JSON.parse(img.getAttribute('data-cands')); }catch(e){}
  if(!list.length) return;
  let i=parseInt(img.getAttribute('data-i')||'0',10)+1;
  if(i>=list.length) i=0;   // 마지막 후보 다음엔 처음으로 순환
  img.setAttribute('data-i', i);
  img.src=list[i];
  const ai=img.getAttribute('data-ai'), hi=img.getAttribute('data-hi');
  if(ai==null||hi==null) return;
  const h=DATA.accounts[ai]&&DATA.accounts[ai].holdings[hi];
  if(!h) return;
  // 고른 후보를 맨 앞으로 보내 다음부터도 이 로고가 먼저 시도되게 고정
  const chosen=list[i];
  h.logos=[chosen, ...list.filter(u=>u!==chosen)];
  h.logo=chosen;
  h.logoPinned=true;   // 사용자가 직접 고른 값이므로 이후 자동 재계산에서 제외
  scheduleSave();
}
function logoFallback(img){
  let list=[]; try{ list=JSON.parse(img.getAttribute('data-cands')); }catch(e){}
  let i=parseInt(img.getAttribute('data-i')||'0',10)+1;
  if(list && i<list.length){
    img.setAttribute('data-i', i);
    img.src=list[i];
  }else{
    const sp=document.createElement('span');
    sp.className='avatar';
    sp.textContent=img.getAttribute('data-letter')||'?';
    img.replaceWith(sp);
  }
}

// YYMMDD <-> 'YYYY-MM-DD' 변환 (2000년대로 가정)
function yymmddToISO(s){
  s=String(s||'').replace(/[^0-9]/g,'');
  if(s.length!==6) return null;
  return `20${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)}`;
}
function isoToYYMMDD(iso){
  if(!iso) return '';
  const p=String(iso).split('-');
  if(p.length!==3) return '';
  return p[0].slice(-2)+p[1]+p[2];
}

function applyHistZoomFromRange(){
  const c=charts['historyChart']; if(c){ c.$mark=null; c.$compare=null; }
  if(!histDateRange){ historyZoom=null; renderHistoryChart(); renderHistoryComparePanel(); return; }
  const min = histDateRange.from ? new Date(histDateRange.from) : null;

const zeroBaseline={
  id:'zeroBaseline',
  afterDatasetsDraw(chart){
    if(!chart.$showZero) return;
    const sc=chart.scales.y1;
    if(!sc) return;
    const y=sc.getPixelForValue(0);
    const {ctx,chartArea}=chart;
    ctx.save();
    ctx.setLineDash([5,4]);
    ctx.strokeStyle='#8b98a5'; ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(chartArea.left, y);
    ctx.lineTo(chartArea.right, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
};

    ${syms.map(s=>`<option value="${s}" ${s===trendSel?'selected':''}>${s} 세부</option>`).join('')}
  </select>`;
  box.innerHTML=`<div class="qqq-title">추세 신호</div>
    <div class="qqq-grid8">
      ${syms.map(compCell).join('')}
      <div class="trend-sel-wrap">${sel}</div>
      ${order.map(detCell).join('')}
    </div>`;
}

// ===== 가상 계산 =====
async function captureSnapshot(){
  if(DATA.snapshot && DATA.snapshot.accounts && Object.keys(DATA.snapshot.accounts).length){
    if(!confirm(`기존 기록(${DATA.snapshot.time})을 지금 시점으로 새로 남길까요?`)) return;
  }
  setStatus('기록 남기는 중...','');
  const j=await(await fetch('/api/snapshot_capture',{method:'POST'})).json();
  if(j.ok){ DATA=j.data; render(); setStatus('기록을 남겼습니다.','ok'); }
  else setStatus('기록 실패','warn');
}
async function clearSnapshot(){
  if(!confirm('가상 계산 기록을 지울까요?')) return;
  const j=await(await fetch('/api/snapshot_clear',{method:'POST'})).json();
  if(j.ok){ DATA=j.data; render(); setStatus('기록을 지웠습니다.','ok'); }
}
async function runSimulation(btn){
  const old=btn.textContent;
  btn.disabled=true; btn.textContent='계산 중…';
  setStatus('가상 계산 시세를 갱신하는 중…');
  try{
    const j=await(await fetch('/api/snapshot_refresh',{method:'POST'})).json();
    if(j.ok){
      DATA=j.data; render();
      if(j.warnings&&j.warnings.length) setStatus('일부 실패: '+j.warnings.join(' / '),'warn');
      else setStatus('가상 계산 완료 · '+new Date().toLocaleTimeString('ko-KR'),'ok');
    } else setStatus('계산 실패','warn');
  }catch(e){ setStatus('계산 실패: '+e,'warn'); }
  btn.disabled=false; btn.textContent=old;
}
function renderVirtual(){
  const box=document.getElementById('virtualBox');
  if(!box) return;
  const snap=DATA.snapshot;
  const timeEl=document.getElementById('virtualTime');
  const clearBtn=document.getElementById('virtualClearBtn');
  if(!snap || !snap.accounts || !Object.keys(snap.accounts).length){
    timeEl.textContent='';
    clearBtn.style.display='none';
    box.innerHTML=`<div class="virtual-empty">계좌 현황의 📸 버튼을 눌러 기록을 남기면,
      그 시점 대비 지금까지의 가격 변화를 여기서 볼 수 있습니다.</div>`;
    return;
  }
  timeEl.textContent=snap.time+' 기준';
  clearBtn.style.display='';
  const fx=(DATA.market&&DATA.market.usdKrw)||0;
  const existing=new Set(DATA.accounts.map(a=>a.name));
  let html='', grand=0;
  Object.entries(snap.accounts).forEach(([name,holdings])=>{
    if(!holdings || !holdings.length) return;
    const label=existing.has(name)?name:`${name} <span class="virtual-missing">(계좌를 찾을 수 없음)</span>`;
    let sub=0;
    const rows=holdings.map(h=>{
      const qty=h.qty||0, cap=h.capturedPrice, price=h.price;
      let profit=null;
      if(price!=null && cap!=null){
        profit=qty*(price-cap);
        if(h.market==='US') profit*=fx;
        sub+=profit;
      }
      const cls=profit==null?'':(profit>=0?'up':'down');
      const txt=profit==null?'시세 확인 불가':(profit>=0?'+':'')+won(profit)+'원';
      return `<tr>
        <td>${h.name||h.code}</td>
        <td class="mono">${num(qty,4)}주</td>
        <td class="mono">${won(cap)}</td>
        <td class="mono">${won(price)}</td>
        <td class="mono ${cls}">${txt}</td>
      </tr>`;
    }).join('');
    grand+=sub;
    html+=`<div class="vacct">
      <div class="vacct-head"><b>${label}</b><span class="${sub>=0?'up':'down'}">${sub>=0?'+':''}${won(sub)}원</span></div>
      <table class="vtable">
        <thead><tr><th>종목</th><th>수량</th><th>기록시 주가</th><th>현재 주가</th><th>변화액</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  });
  html+=`<div class="vtotal"><span>전체 합계</span><span class="${grand>=0?'up':'down'}">${grand>=0?'+':''}${won(grand)}원</span></div>`;
  box.innerHTML=html;
}

let sectorChartName=null;
function onSectorChartSelect(v){ sectorChartName=v; renderSectorChart(); }
function renderSectorChart(){
  ensureSectors();
  const id='sectorChart';
  const sel=document.getElementById('sectorChartSelect');
  if(sel){
    if(!sectorChartName || !DATA.accounts.some(a=>a.name===sectorChartName))
      sectorChartName=DATA.accounts[0]?.name||null;
    sel.innerHTML=DATA.accounts.map(a=>
      `<option value="${a.name}" ${a.name===sectorChartName?'selected':''}>${a.name}</option>`).join('');
  }
  if(charts[id])charts[id].destroy();
  const acc=DATA.accounts.find(a=>a.name===sectorChartName);
  const cv=document.getElementById(id); if(!cv||!acc) return;
  const fx=DATA.market.usdKrw||0;

  // 이 계좌의 섹터별 현재 주식 평가액
  const bySector={}; let stockTotal=0;
  (acc.holdings||[]).forEach(h=>{
    const v=h.market==='US'?(h.qty||0)*(h.price||0)*fx:(h.qty||0)*(h.price||0);
    stockTotal+=v;
    const key=h.sector||'(미지정)';
    bySector[key]=(bySector[key]||0)+v;
  });

  // 목표 비중이 설정된 섹터 중, '이 계좌에 실제로 보유한' 섹터만 남긴다
  let present=DATA.sectors.filter(s=>s.target!=null && (bySector[s.name]||0)>0);
  // 남은 섹터의 목표 비중을 합 100%로 재정규화
  const tgtSum=present.reduce((t,s)=>t+(s.target||0),0);
  present=present.map(s=>({name:s.name,
      target: tgtSum? (s.target||0)/tgtSum*100 : 0,
      cur: stockTotal? (bySector[s.name]||0)/stockTotal*100 : 0}))
    .sort((a,b)=>b.target-a.target);   // 목표 내림차순

  const noData=!present.length;
  const ctx2=cv.getContext('2d');

  const names=present.map(s=>s.name);
  const cur=present.map(s=>s.cur);
  const tgt=present.map(s=>s.target);
  // x축 라벨: 섹터명 + (현재−목표)
  const labels=present.map(s=>{
    const d=s.cur-s.target;
    return [s.name, `(${d>=0?'+':''}${d.toFixed(1)}%)`];
  });

  if(noData){
    ctx2.clearRect(0,0,cv.width,cv.height);
    ctx2.fillStyle='#8b98a5'; ctx2.font='13px sans-serif';
    ctx2.textAlign='center'; ctx2.textBaseline='middle';
    ctx2.fillText('이 계좌에 해당하는 섹터가 없습니다', cv.width/2, cv.height/2);
    return;
  }

  // 알림 계산: (현재−목표) 기준
  const th=DATA.sectorThresh;
  const alerts=[];
  present.forEach(s=>{
    const d=s.cur-s.target;
    if(d>=th.reduce) alerts.push({txt:`${s.name} 비중 축소`, type:'reduce'});
    else if(d<=th.expand) alerts.push({txt:`${s.name} 비중 확대`, type:'expand'});
  });

  charts[id]=new Chart(cv,{type:'bar',
    data:{labels,datasets:[
      {label:'현재 비중',data:cur,backgroundColor:'#4c8dff',barPercentage:0.7,categoryPercentage:0.62},
      {label:'목표 비중',data:tgt,backgroundColor:'#c9a227',barPercentage:0.7,categoryPercentage:0.62},
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8b98a5',boxWidth:12}},
        tooltip:{callbacks:{title:items=>items[0].label.replace(',',' '),
          label:c=>c.dataset.label+': '+c.parsed.y.toFixed(1)+'%'}}},
      scales:{x:{ticks:{color:'#8b98a5'},grid:{display:false}},
        y:{ticks:{color:'#5c6773',callback:v=>v+'%'},grid:{color:'#20272f'},beginAtZero:true}}},
    plugins:[sectorAlerts]});
  charts[id].$alerts=alerts;
}

function pieSegments(acc){
  const fx=DATA.market.usdKrw||0;
  const segs=[];
  // 현금 (원화 + 달러 환산)
  const cash=(acc.cashKRW||0)+(acc.cashUSD||0)*fx;
  if(cash>0) segs.push({key:'__cash',label:'현금',ticker:'현금',outer:'현금',value:cash,color:'#5c6773',group:'CASH'});
  // 종목 (원화 평가액)
  (acc.holdings||[]).forEach(h=>{
    const price=h.price||0;
    const val=h.market==='US'?(h.qty||0)*price*fx:(h.qty||0)*price;
    const nm=(h.name||h.code||'').trim()||h.code;
    const tk=(h.code||'').trim();
    if(val>0) segs.push({
      key:(h.market==='US'?'US:':'KR:')+tk,
      label:nm,
      ticker:tk,
      outer:h.market==='US'?tk:nm,  // 미장=티커, 국장=종목명
      value:val,
      group:h.market==='US'?'US':'KR'
    });
  });
  // 국장=파랑 계열, 미장=주황 계열로 색 배정
  const krC=['#4c8dff','#6aa0ff','#3b6fc9','#8bb6ff','#2b5fa8','#a9ccff','#1f4e8c','#c3dcff'];
  const usC=['#e8834a','#f0a072','#c96a34','#f6bd9a','#a85526','#fad3bd','#8f451c','#ffe6d6'];
  let ki=0,ui=0;
  segs.forEach(s=>{ if(s.group==='KR')s.color=krC[ki++%krC.length];
    else if(s.group==='US')s.color=usC[ui++%usC.length]; });
  return segs;
}

// 선택(블록) 표시: 선택되지 않은 조각은 흐리게, 중앙에 합계 비중 표시
const selectOverlay={
  id:'selectOverlay',
  afterDatasetsDraw(chart){
    const sel=chart.$sel;
    if(!sel||!sel.size) return;
    const meta=chart.getDatasetMeta(0);
    const segs=chart.$segs||[];
    const {ctx}=chart;
    ctx.save();
    // 선택 안 된 조각을 어둡게 덮기
    meta.data.forEach((arc,i)=>{
      if(sel.has(i)) return;
      ctx.globalAlpha=.62; ctx.fillStyle='#0e1116';
      ctx.beginPath();
      ctx.arc(arc.x,arc.y,arc.outerRadius,arc.startAngle,arc.endAngle);
      ctx.arc(arc.x,arc.y,arc.innerRadius,arc.endAngle,arc.startAngle,true);
      ctx.closePath(); ctx.fill();
    });
    // 선택된 조각 테두리 강조
    ctx.globalAlpha=1;
    meta.data.forEach((arc,i)=>{
      if(!sel.has(i)) return;
      const c=(segs[i]&&segs[i].color)||'#fff';
      ctx.strokeStyle=c; ctx.lineWidth=2.5;
      ctx.shadowColor=c; ctx.shadowBlur=8;
      ctx.beginPath();
      ctx.arc(arc.x,arc.y,arc.outerRadius,arc.startAngle,arc.endAngle);
      ctx.arc(arc.x,arc.y,arc.innerRadius,arc.endAngle,arc.startAngle,true);
      ctx.closePath(); ctx.stroke();
    });
    ctx.shadowBlur=0;
    // 중앙에 합계 비중
    const total=segs.reduce((s,x)=>s+x.value,0);
    let sum=0; sel.forEach(i=>{ if(segs[i]) sum+=segs[i].value; });
    const pctTxt=total? (sum/total*100).toFixed(1)+'%' : '-';
    const a0=meta.data[0];
    if(a0){
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#e6edf3';
      ctx.font='700 26px -apple-system,Segoe UI,sans-serif';
      ctx.fillText(pctTxt, a0.x, a0.y-6);
      ctx.fillStyle='#8b98a5';
      ctx.font='12px -apple-system,Segoe UI,sans-serif';
      ctx.fillText(`${sel.size}개 선택 · ${won(sum)}원`, a0.x, a0.y+16);
    }
    ctx.restore();
  }
};

// 마우스 오버된 조각에 은은한 네온 강조
const arcGlow={
  id:'arcGlow',
  afterDatasetsDraw(chart){

    if(idx==null||idx<0) return;
    const meta=chart.getDatasetMeta(0);

// 도넛 바깥에 라벨을 카드 좌우 끝까지 빼고, 세로로 겹치지 않게 밀어내는 플러그인
const outerLabels={
  id:'outerLabels',
  afterDraw(chart){
    const {ctx}=chart;
    const meta=chart.getDatasetMeta(0);
    const segs=chart.$segs||[];
    if(!meta.data.length) return;
    const cx=meta.data[0].x, cy=meta.data[0].y;
    const r=meta.data[0].outerRadius;
    const W=chart.width, H=chart.height;   // 캔버스(카드) 전체 크기
    ctx.save();
    ctx.font='13px -apple-system,Segoe UI,sans-serif';
    ctx.textBaseline='middle';

    // 1) 각 조각의 각도·기준 y 를 구해 좌우로 분류
    const items=[];
    meta.data.forEach((arc,i)=>{
      const s=segs[i]; if(!s||!s.outer) return;
      const ang=(arc.startAngle+arc.endAngle)/2;
      const right=Math.cos(ang)>=0;
      items.push({
        s, ang, right, idx:i,
        yIdeal: cy+Math.sin(ang)*r,
        anchorX: cx+Math.cos(ang)*r,
        anchorY: cy+Math.sin(ang)*r,
      });
    });
    const left=items.filter(o=>!o.right).sort((a,b)=>a.yIdeal-b.yIdeal);
    const right=items.filter(o=>o.right).sort((a,b)=>a.yIdeal-b.yIdeal);

    // 2) 라벨을 카드 세로 전체에 '균등 간격'으로 배치
    //    (각도 순서는 그대로 유지 → 지시선이 꼬이지 않음)
    //    ※ 도넛 크기·위치는 전혀 건드리지 않는다.
    const top=10, bottom=H-10;
    function pack(list){
      const n=list.length;
      if(n===0) return;
      if(n===1){ list[0].y=Math.min(Math.max(list[0].yIdeal,top),bottom); return; }
      const span=bottom-top;
      const step=span/(n-1);          // 균등 간격
      for(let i=0;i<n;i++) list[i].y=top+step*i;
    }
    pack(left); pack(right);

    // 3) 라벨 텍스트 + 지시선 그리기
    //    ⓐ 레인 순서를 '조각의 세로 순서'와 동일하게 두어 선끼리 교차하지 않게 하고
    //    ⓑ 조각과 라벨의 높이가 거의 같으면 직선 하나로만 잇는다.
    const rightX=W-8, leftX=8;
    const hot=[];   // 마우스 오버 감지용 좌표 저장
    function draw(o, edgeX, lane, laneCount){
      const s=o.s;
      const isSel = !!(chart.$sel && chart.$sel.has(o.idx));   // 블록 선택됨
      const hi = (chart.$hoverIdx===o.idx) || isSel;           // 강조 여부
      const tw=ctx.measureText(s.outer).width;
      const innerX = o.right ? (edgeX - tw - 6) : (edgeX + tw + 6); // 텍스트 안쪽 끝
      const startX = o.anchorX, startY = o.anchorY;

      // 레인 배치: 도넛 바깥 공통 구간에 균일하게 깐다.
      // 선이 많을수록 간격을 자동으로 좁혀(밴드 폭 고정), 라벨을 파고들지 않게 한다.
      const nearX = o.right ? cx + r + 16 : cx - r - 16;
      const dir   = o.right ? 1 : -1;
      const band  = 120;                   // 레인 전체가 차지할 최대 가로 폭
      const step  = laneCount>1
        ? Math.max(9, Math.min(24, band/(laneCount-1)))   // 9~24px 사이
        : 0;
      let turnX = nearX + dir*step*lane;
      // 세로로 꺾이는 지점이 라벨을 지나치면 선이 되돌아와(ㄷ자) 지저분해진다.
      // turnX 를 라벨 안쪽 끝보다 항상 도넛 쪽에 두어 ㄷ자를 방지한다.
      if(o.right) turnX = Math.min(turnX, innerX - 8);
      else        turnX = Math.max(turnX, innerX + 8);

      ctx.save();
      if(hi){                                        // 네온 강조
        ctx.shadowColor=s.color; ctx.shadowBlur=10;
        ctx.strokeStyle=s.color; ctx.lineWidth=2;
      }else{
        // 선택이 있을 때 선택 안 된 항목의 선은 흐리게
        if(chart.$sel && chart.$sel.size) ctx.globalAlpha=.35;
        ctx.strokeStyle=s.color; ctx.lineWidth=1;
      }
      ctx.beginPath();
      if(Math.abs(startY-o.y) < 2){                  // ⓑ 높이가 같으면 직선 하나
        ctx.moveTo(startX, o.y);
        ctx.lineTo(innerX, o.y);
      }else{
        ctx.moveTo(startX, startY);   // 조각 가장자리
        ctx.lineTo(turnX, startY);    // ① 가로
        ctx.lineTo(turnX, o.y);       // ② 세로
        ctx.lineTo(innerX, o.y);      // ③ 가로 (라벨까지)
      }
      ctx.stroke();
      ctx.restore();

      // 라벨 텍스트 (강조 시 네온 테두리 / 선택 시 배경 블록)
      const anySel = !!(chart.$sel && chart.$sel.size);
      ctx.save();
      ctx.textAlign=o.right?'right':'left';
      const bx0 = o.right ? edgeX-tw : edgeX;
      if(isSel){
        // 선택된 라벨: 은은한 배경 블록 + 테두리
        ctx.globalAlpha=.18; ctx.fillStyle=s.color;
        ctx.fillRect(bx0-7, o.y-11, tw+14, 22);
        ctx.globalAlpha=1;
        ctx.strokeStyle=s.color; ctx.lineWidth=1.2;
        ctx.shadowColor=s.color; ctx.shadowBlur=7;
        ctx.strokeRect(bx0-7, o.y-11, tw+14, 22);
        ctx.shadowBlur=0;
      }
      if(hi){
        ctx.shadowColor=s.color; ctx.shadowBlur=8;
        ctx.lineWidth=2.5; ctx.strokeStyle=s.color;
        ctx.strokeText(s.outer, edgeX, o.y);
        ctx.shadowBlur=0;
        ctx.fillStyle='#ffffff';
      }else{
        // 선택이 있는 상태에서 선택 안 된 라벨은 흐리게
        ctx.fillStyle = anySel ? '#6b7683' : '#d5dde5';
      }
      ctx.fillText(s.outer, edgeX, o.y);
      ctx.restore();

      // 마우스 오버 영역 (라벨 텍스트 박스)
      const x0 = o.right ? edgeX-tw : edgeX;
      hot.push({idx:o.idx, x0, x1:x0+tw, y0:o.y-9, y1:o.y+9});
    }
    // ⓐ 레인 순서 = 조각의 세로 순서 → 선이 서로 교차하지 않음
    //    (list 는 이미 조각 위치 기준 오름차순 정렬되어 있음)
    function assignLanes(list, edgeX){
      const n=list.length;
      list.forEach((o,k)=>draw(o, edgeX, k, n));
    }
    assignLanes(left, leftX);
    assignLanes(right, rightX);
    chart.$hot=hot;
    ctx.restore();
  }
};

function renderPie(animate){
  const sel=document.getElementById('pieSelect');
  if(!pieName || !DATA.accounts.some(a=>a.name===pieName))
    pieName=DATA.accounts[0]?.name||null;
  sel.innerHTML=DATA.accounts.map(a=>
    `<option value="${a.name}" ${a.name===pieName?'selected':''}>${a.name}</option>`).join('');
  const acc=DATA.accounts.find(a=>a.name===pieName);
  const id='pieChart';
  if(charts[id])charts[id].destroy();
  if(!acc) return;
  const segs=pieSegments(acc);
  const total=segs.reduce((s,x)=>s+x.value,0);
  const ctx=document.getElementById(id);
  charts[id]=new Chart(ctx,{
    type:'doughnut',
    data:{labels:segs.map(s=>s.label),
      datasets:[{data:segs.map(s=>s.value),backgroundColor:segs.map(s=>s.color),
        borderColor:'#161b22',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,
      animation: animate ? undefined : false,   // 계좌 전환 때만 애니메이션
      layout:{padding:{top:22,bottom:22,left:145,right:145}},cutout:'55%',
      plugins:{legend:{display:false},
        tooltip:{callbacks:{
          label:c=>{const v=c.parsed;const p=total?(v/total*100):0;
            return ` ${segs[c.dataIndex].label}: ${won(v)}원 (${p.toFixed(1)}%)`;}}}}},
    plugins:[arcGlow, selectOverlay, outerLabels, dragGhost]
  });
  charts[id].$segs=segs;
  charts[id].$hoverIdx=-1;
  charts[id].$sel=new Set();
  charts[id].$selAnchor=null;
  // Esc 키 또는 차트 밖 클릭 → 선택 해제
  if(window.__pieEsc) window.removeEventListener('keydown', window.__pieEsc);
  window.__pieEsc=(ev)=>{
    if(ev.key!=='Escape') return;
    const ch=charts['pieChart'];
    if(ch&&ch.$sel&&ch.$sel.size){ ch.$sel.clear(); ch.$selAnchor=null; ch.render(); }
  };
  window.addEventListener('keydown', window.__pieEsc);
  if(window.__pieOutside) window.removeEventListener('mousedown', window.__pieOutside);
  window.__pieOutside=(ev)=>{
    const ch=charts['pieChart']; if(!ch||!ch.$sel||!ch.$sel.size) return;
    const el=document.getElementById('pieChart');
    if(el && !el.contains(ev.target)){ ch.$sel.clear(); ch.$selAnchor=null; ch.render(); }
  };
  window.addEventListener('mousedown', window.__pieOutside);
  // 저장된 라벨 위치 불러오기 (계좌별)
  const cv=document.getElementById(id);
  let dragIdx=-1;          // 잡은 항목의 조각 인덱스
  function hitLabel(e){
    const ch=charts[id]; if(!ch) return -1;
    const rect=cv.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    for(const h of (ch.$hot||[])){
      if(mx>=h.x0-8&&mx<=h.x1+8&&my>=h.y0-4&&my<=h.y1+4) return h.idx;
    }
    return -1;
  }
  function hitArc(e){
    const ch=charts[id]; if(!ch) return -1;
    const rect=cv.getBoundingClientRect();
    const mx=e.clientX-rect.left, my=e.clientY-rect.top;
    const meta=ch.getDatasetMeta(0);
    for(let i=0;i<meta.data.length;i++){
      const arc=meta.data[i];
      const dx=mx-arc.x, dy=my-arc.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>=arc.innerRadius && dist<=arc.outerRadius){
        let a=Math.atan2(dy,dx);
        while(a<arc.startAngle) a+=Math.PI*2;
        if(a<=arc.endAngle) return i;
      }
    }
    return -1;
  }
  function hitAny(e){ const i=hitLabel(e); return i>=0?i:hitArc(e); }

  // 두 종목의 '보유 목록상 순서'를 서로 맞바꾼다 → 조각과 티커가 함께 자리 교환
  function swapSegments(aIdx,bIdx){
    const ch=charts[id]; if(!ch) return;
    const A=ch.$segs[aIdx], B=ch.$segs[bIdx];
    if(!A||!B) return;
    if(A.key==='__cash'||B.key==='__cash') return;      // 현금은 제외
    const acc=DATA.accounts.find(x=>x.name===pieName);
    if(!acc) return;
    const find=(seg)=>acc.holdings.findIndex(h=>
      ((h.market==='US'?'US:':'KR:')+(h.code||'').trim())===seg.key);
    const ia=find(A), ib=find(B);
    if(ia<0||ib<0) return;
    const tmp=acc.holdings[ia];
    acc.holdings[ia]=acc.holdings[ib];
    acc.holdings[ib]=tmp;
    scheduleSave();
    renderPie();          // 조각·티커가 함께 새 순서로 다시 그려짐
  }

  cv.onmousedown=(e)=>{
    const ch=charts[id]; if(!ch) return;
    const i=hitAny(e);
    // Ctrl/Shift 클릭은 '선택' 동작 (드래그 교환 아님)
    if(i>=0 && (e.ctrlKey||e.metaKey||e.shiftKey)){
      e.preventDefault();
      ch.$sel = ch.$sel || new Set();
      if(e.shiftKey && ch.$selAnchor!=null){
        // 앵커 ~ 현재 사이의 조각을 모두 선택
        const a=Math.min(ch.$selAnchor,i), b=Math.max(ch.$selAnchor,i);
        for(let k=a;k<=b;k++) ch.$sel.add(k);
      }else{
        if(ch.$sel.has(i)) ch.$sel.delete(i); else ch.$sel.add(i);
        ch.$selAnchor=i;
      }
      ch.render();
      return;
    }
    if(i>=0){
      dragIdx=i;
      const rect=cv.getBoundingClientRect();
      ch.$drag={from:i, over:-1, overBox:null,
                x:e.clientX-rect.left, y:e.clientY-rect.top};
      cv.style.cursor='grabbing'; e.preventDefault(); ch.render();
    }else{
      // 차트 안 빈 곳 클릭 → 선택 해제
      if(ch.$sel&&ch.$sel.size){ ch.$sel.clear(); ch.$selAnchor=null; ch.render(); }
    }
  };
  if(cv.__onup) window.removeEventListener('mouseup', cv.__onup);
  cv.__onup=(e)=>{
    const ch=charts[id];
    if(dragIdx<0){ return; }
    const target=hitAny(e);
    const from=dragIdx;
    dragIdx=-1; cv.style.cursor='';
    if(ch) ch.$drag=null;
    if(target>=0 && target!==from) swapSegments(from,target);
    else if(ch) ch.render();
  };
  window.addEventListener('mouseup', cv.__onup);

  cv.onmousemove=(e)=>{
    const ch=charts[id]; if(!ch) return;
    const rect=cv.getBoundingClientRect();
    const found=hitAny(e);
    if(dragIdx>=0){
      // 드래그 중: 반투명 미리보기를 커서에 붙여 이동
      const box=(ch.$hot||[]).find(h=>h.idx===found);
      ch.$drag={from:dragIdx, over:found, overBox:box||null,
                x:e.clientX-rect.left, y:e.clientY-rect.top};
      cv.style.cursor='grabbing';
      ch.render();
      return;
    }
    cv.style.cursor = found>=0 ? 'grab' : '';
    if(found!==ch.$hoverIdx){ ch.$hoverIdx=found; ch.render(); }
  };
  cv.onmouseleave=()=>{
    const ch=charts[id]; if(!ch) return;
    if(ch.$hoverIdx!==-1){ ch.$hoverIdx=-1; ch.render(); }
  };
  charts[id].update();
}
// 드래그로 x축 구간 확대 (수익 금액 그래프용)
const dragZoom={
  id:'dragZoom',
  afterDraw(chart){
    const d=chart.$zoomDrag;
    if(!d||d.x0==null||d.x1==null) return;
    const {ctx,chartArea}=chart;
    const x0=Math.min(d.x0,d.x1), x1=Math.max(d.x0,d.x1);
    ctx.save();
    ctx.fillStyle='rgba(76,141,255,0.15)';
    ctx.fillRect(x0,chartArea.top,x1-x0,chartArea.bottom-chartArea.top);
    ctx.strokeStyle='rgba(76,141,255,0.6)'; ctx.lineWidth=1;
    ctx.strokeRect(x0,chartArea.top,x1-x0,chartArea.bottom-chartArea.top);
    ctx.restore();
  }
};

// 클릭한 점의 y값을 가로선 + 숫자로 표시 (또는 비교 모드일 땐 두 지점에 세로선)
const pointMarker={
  id:'pointMarker',
  afterDatasetsDraw(chart){
    if(chart.$compare){
      const {ctx,chartArea}=chart;
      const xs=chart.scales.x;
      [chart.$compare.date1, chart.$compare.date2].forEach(d=>{
        if(d==null) return;
        const x=xs.getPixelForValue(new Date(d).getTime());
        if(x==null||isNaN(x)) return;   // 확대 구간 밖이면 선은 생략(우측 패널 수치는 그대로 유효)
        ctx.save();
        ctx.setLineDash([5,4]); ctx.strokeStyle='#8b98a5'; ctx.lineWidth=1.2; ctx.globalAlpha=.8;
        ctx.beginPath(); ctx.moveTo(x,chartArea.top); ctx.lineTo(x,chartArea.bottom); ctx.stroke();
        ctx.restore();
      });
      return;
    }
    const m=chart.$mark;
    if(!m) return;
    const meta=chart.getDatasetMeta(m.ds);
    if(!meta||!meta.data[m.idx]) return;
    const pt=meta.data[m.idx];
    const {ctx,chartArea}=chart;
    const color=(chart.data.datasets[m.ds]||{}).borderColor||'#4c8dff';
    const rawPt=chart.data.datasets[m.ds].data[m.idx];
    const dateTxt=(rawPt&&rawPt.x)||'';
    ctx.save();
    ctx.setLineDash([5,4]); ctx.strokeStyle=color; ctx.lineWidth=1.2; ctx.globalAlpha=.8;
    // 가로 기준선 (y값)
    ctx.beginPath(); ctx.moveTo(chartArea.left,pt.y); ctx.lineTo(chartArea.right,pt.y); ctx.stroke();
    // 세로 기준선 (x값)
    ctx.beginPath(); ctx.moveTo(pt.x,chartArea.top); ctx.lineTo(pt.x,chartArea.bottom); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;
    // 점 강조
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#0e1116'; ctx.lineWidth=1.5; ctx.stroke();

    const chip=(x,y,txt,anchor)=>{        // anchor: 'l'|'r'|'c'
      ctx.font='700 12px -apple-system,Segoe UI,sans-serif';
      const w=ctx.measureText(txt).width+14, h=20;
      let bx = anchor==='l'? x : anchor==='r'? x-w : x-w/2;
      bx=Math.max(chartArea.left, Math.min(bx, chartArea.right-w));
      let by=y;
      by=Math.max(chartArea.top, Math.min(by, chartArea.bottom-h));
      ctx.fillStyle='#1c232d'; ctx.strokeStyle=color; ctx.lineWidth=1;
      ctx.beginPath(); ctx.roundRect(bx,by,w,h,5); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#e6edf3'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(txt, bx+7, by+h/2);
    };
    // y값 라벨: 점 옆
    chip(pt.x+10, pt.y-10, won(m.value)+'원', pt.x+120>chartArea.right?'r':'l');
    // x값(날짜) 라벨: 세로선 아래 x축 근처
    chip(pt.x, chartArea.bottom-22, dateTxt, 'c');
    ctx.restore();
  }
};

function drawLine(id,datasets,min,max){
  if(charts[id])charts[id].destroy();
  const cv=document.getElementById(id);
  charts[id]=new Chart(cv,{type:'line',data:{datasets},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:'#8b98a5',boxWidth:12}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+won(c.parsed.y)+'원'}}},
      scales:{x:{type:'time',min,max,
          time:{tooltipFormat:'yyyy-MM-dd',displayFormats:{day:'MM-dd',week:'MM-dd',month:'yyyy-MM'}},
          ticks:{color:'#5c6773',maxTicksLimit:9},grid:{color:'#20272f'}},
        y:{ticks:{color:'#5c6773',callback:v=>(v/1e6).toFixed(0)+'M'},grid:{color:'#20272f'}}}},
    plugins:[dragZoom, pointMarker]});

  // 수익 금액 그래프에만 드래그 확대 기능을 붙인다
  if(id==='historyChart'){
    const ch=charts[id];
    let dragging=false;
    cv.onmousedown=(e)=>{
      const rect=cv.getBoundingClientRect();
      const x=e.clientX-rect.left;
      const area=ch.chartArea;
      if(x<area.left||x>area.right) return;
      dragging=true;
      ch.$zoomDrag={x0:x,x1:x};
      ch.draw();
    };
    cv.onmousemove=(e)=>{
      if(!dragging) return;
      const rect=cv.getBoundingClientRect();
      let x=e.clientX-rect.left;
      const area=ch.chartArea;
      x=Math.max(area.left,Math.min(area.right,x));
      ch.$zoomDrag.x1=x;
      ch.draw();
    };
    if(cv.__zoomUp) window.removeEventListener('mouseup',cv.__zoomUp);
    cv.__zoomUp=(e)=>{
      if(!dragging) return;
      dragging=false;
      const d=ch.$zoomDrag; ch.$zoomDrag=null;
      if(!d){ ch.draw(); return; }
      const x0=Math.min(d.x0,d.x1), x1=Math.max(d.x0,d.x1);
      if(x1-x0<10){
        // 드래그가 아주 짧으면 '클릭'으로 간주
        const els=ch.getElementsAtEventForMode(e,'nearest',{intersect:false},true);
        if(els.length){
          const el=els[0];
          const pt=ch.data.datasets[el.datasetIndex].data[el.index];
          const date=pt?pt.x:null;
          if((e.ctrlKey||e.metaKey) && ch.$mark){
            // 이미 찍힌 점이 있는 상태에서 Ctrl+클릭 → 두 지점 비교 모드
            const markPt=ch.data.datasets[ch.$mark.ds].data[ch.$mark.idx];
            ch.$compare={date1:markPt?markPt.x:null, date2:date};
            ch.$mark=null;
          } else {
            // 일반 클릭 → 그 점의 y값만 표시(비교 모드는 해제)
            ch.$compare=null;
            const v=pt?pt.y:null;
            if(v!=null) ch.$mark={ds:el.datasetIndex, idx:el.index, value:v};
            else ch.$mark=null;
          }
        }
        ch.draw();
        renderHistoryComparePanel();
        return;
      }
      // 픽셀 → 실제 시각(타임스탬프)으로 변환 (시간축이라 인덱스 계산이 필요 없음)
      const xs=ch.scales.x;
      const t0=xs.getValueForPixel(x0);
      const t1=xs.getValueForPixel(x1);
      ch.$mark=null; ch.$compare=null;           // 확대 시 기존 표시 해제
      historyZoom={min:new Date(Math.min(t0,t1)), max:new Date(Math.max(t0,t1))};
      renderHistoryChart();
    };
    window.addEventListener('mouseup',cv.__zoomUp);

    // 그래프 바깥을 클릭하면 확대·표시를 원래대로 복원
    if(window.__histReset) window.removeEventListener('mousedown',window.__histReset);
    window.__histReset=(e)=>{
      if(cv.contains(e.target)) return;
      let changed=false;
      const c=charts['historyChart'];
      if(c&&(c.$mark||c.$compare)){ c.$mark=null; c.$compare=null; c.draw(); renderHistoryComparePanel(); changed=true; }
      if(historyZoom){ historyZoom=null; renderHistoryChart(); changed=true; }
    };
    window.addEventListener('mousedown',window.__histReset);

    // Esc 키로 표시·비교 모드 해제
    if(window.__histEsc) window.removeEventListener('keydown',window.__histEsc);
    window.__histEsc=(e)=>{
      if(e.key!=='Escape') return;
      const c=charts['historyChart'];
      if(c&&(c.$mark||c.$compare)){ c.$mark=null; c.$compare=null; c.draw(); renderHistoryComparePanel(); }
    };
    window.addEventListener('keydown',window.__histEsc);

    renderHistoryComparePanel();
  }
}
function renderHistoryComparePanel(){
  const box=document.getElementById('historyCompare');
  if(!box) return;
  const c=charts['historyChart'];
  const cmp=c&&c.$compare;
  if(!cmp){ box.innerHTML=''; return; }
  const r1=DATA.history.find(r=>r.date===cmp.date1);
  const r2=DATA.history.find(r=>r.date===cmp.date2);
  if(!r1||!r2){ box.innerHTML=''; return; }
  const [a,b]=cmp.date1<=cmp.date2?[r1,r2]:[r2,r1];   // 항상 이른 날짜→늦은 날짜 순
  let total=0;
  const rows=DATA.accounts.filter(acc=>picked[acc.name]).map(acc=>{
    const v1=a.profits[acc.name], v2=b.profits[acc.name];
    if(v1==null||v2==null) return `<div class="hist-compare-row"><span>${acc.name}</span><span>-</span></div>`;
    const d=v2-v1; total+=d;
    return `<div class="hist-compare-row"><span>${acc.name}</span><span class="${d>=0?'up':'down'}">${d>=0?'+':''}${won(d)}원</span></div>`;
  }).join('');
  box.innerHTML=`<div class="hist-compare-title">${a.date} → ${b.date}</div>
    ${rows}
    <div class="hist-compare-total"><span>합계</span><span class="${total>=0?'up':'down'}">${total>=0?'+':''}${won(total)}원</span></div>`;
}
function drawBar(id,labels,datasets,pctAxis){
  if(charts[id])charts[id].destroy();
  datasets=datasets.map(d=>({...d,barPercentage:0.55,categoryPercentage:0.6}));
  charts[id]=new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:datasets.length>1,labels:{color:'#8b98a5',boxWidth:12}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+(pctAxis?c.parsed.y.toFixed(1)+'%':won(c.parsed.y)+'원')}}},
      scales:{x:{ticks:{color:'#8b98a5'},grid:{display:false}},
        y:{ticks:{color:'#5c6773',callback:v=>pctAxis?v+'%':(v/1e6).toFixed(0)+'M'},
           grid:{color:'#20272f'},...(pctAxis?{max:100}:{})}}}});
}
