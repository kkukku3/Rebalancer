<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>리밸런서 · 모바일</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rebalancer">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --panel2:#161d2b; --line:#232b3a;
    --ink:#e8edf5; --muted:#9aa6b8; --dim:#69748a;
    --accent:#4c8dff; --up:#e5484d; --down:#3fb950; --gold:#c9a227;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:40px}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 80%,transparent);
    padding:18px 16px 6px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
  header .sub{font-size:11px;color:var(--dim);margin-top:2px}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);cursor:pointer;font-size:16px;flex-shrink:0}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.spin svg{animation:spin .8s linear infinite}
  .icon-btn.editing{background:rgba(76,141,255,.16);border-color:var(--accent);color:var(--accent)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .edit-mini-btn{font-size:12px;font-weight:700;padding:8px 14px;border-radius:9px;
    border:1px solid var(--line);cursor:pointer}
  .edit-mini-btn.cancel{background:var(--panel2);color:var(--muted)}
  .edit-mini-btn.save{background:var(--accent);border-color:var(--accent);color:#04101f}
  .edit-mini-btn:disabled{opacity:.5}
  .ef-input{background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:5px 7px;font:inherit;font-size:12px;width:100%}
  .ef-row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .ef-row label{font-size:11px;color:var(--dim);width:88px;flex-shrink:0}
  .ef-del{color:var(--up);font-size:16px;cursor:pointer;flex-shrink:0;padding:2px 6px}
  .ef-add-btn{width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px dashed var(--line);
    background:transparent;color:var(--dim);font-size:12px;cursor:pointer}
  .ef-warn-box{background:rgba(232,131,74,.1);border:1px solid rgba(232,131,74,.4);
    border-radius:10px;padding:12px;font-size:12.5px;line-height:1.6;color:var(--ink);margin-bottom:14px}

  .tabbar{position:sticky;top:62px;z-index:9;background:var(--bg);
    display:flex;gap:6px;padding:8px 16px 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab-btn{flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:13px;
    font-weight:600;color:var(--dim);background:transparent;cursor:pointer}
  .tab-btn.active{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}

  #loginScreen{min-height:88vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:24px}
  .brand-text{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--ink);
    margin-bottom:14px}
  #loginScreen p{font-size:13px;color:var(--muted);line-height:1.6;max-width:280px;margin:0 0 26px}
  .g-btn{background:var(--ink);color:#0a0e14;border:none;border-radius:12px;
    padding:13px 26px;font-size:14px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px -4px rgba(0,0,0,.4)}
  .g-btn:active{transform:scale(.97)}
  .scope-note{margin-top:16px;font-size:11px;color:var(--dim);max-width:260px;line-height:1.6}
  .auto-checking{display:flex;flex-direction:column;align-items:center;gap:12px;
    color:var(--dim);font-size:12.5px}
  .auto-checking .spinner{width:22px;height:22px;border-radius:50%;
    border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}

  .state-box{margin:60px 16px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}


  /* ===== 수정 시트 (아래에서 올라오는 입력창) ===== */
  .sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:520px;
    max-height:92vh;display:flex;flex-direction:column;animation:sheetUp .18s ease-out}
  @keyframes sheetUp{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;gap:10px}
  .sheet-title{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet-x{color:var(--dim);font-size:18px;padding:4px 8px;cursor:pointer}
  .sheet-body{padding:2px 16px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
  .sh-sub{font-size:12px;color:var(--dim);margin-bottom:6px}
  .sh-field{margin:12px 0}
  .sh-field>label{display:block;font-size:11px;color:var(--dim);margin-bottom:5px}
  .sh-in{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 12px}
  .sh-in:focus-within{border-color:var(--accent)}
  .sh-in{min-width:0}
  .sh-in input{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:18px;padding:12px 0;outline:none}
  .sh-in .u{color:var(--dim);font-size:13px;margin-left:6px;flex-shrink:0}
  .sh-in .p{color:var(--dim);font-size:15px;margin-right:6px}
  .sh-in.bad{border-color:var(--up)}
  .sh-err{color:var(--up);font-size:11.5px;margin-top:4px;min-height:0}
  .sh-btn{flex:1;padding:13px;border-radius:10px;border:0;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
  .sh-btn.pri{background:var(--accent);color:#04101f}
  .sh-btn.pri:disabled{opacity:.35}
  .sh-btn.sec{background:var(--panel2);flex:0 0 30%}
  .sh-pv{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:12px 0;font-size:12.5px}
  .sh-pv .r{display:grid;grid-template-columns:62px 1fr 14px 1fr;gap:4px;padding:4px 0;align-items:baseline}
  .sh-pv .r .k{color:var(--dim)} .sh-pv .r .a{text-align:right;color:var(--muted)} .sh-pv .r .b{text-align:right;font-weight:700}
  .sh-pv .r .ar{color:var(--dim);text-align:center}
  .sh-more{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim)}
  .sh-more select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12px;max-width:55%}
  .sh-link{color:var(--dim);font-size:12px;text-decoration:underline;cursor:pointer}
  .sh-link.danger{color:var(--up)}
  .sh-sec{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 4px}
  .sh-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
  .sh-chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
  .sh-seg{display:flex;gap:6px}
  .sh-seg div{flex:1;text-align:center;padding:9px 0;border-radius:9px;border:1px solid var(--line);color:var(--dim);font-size:13px;cursor:pointer}
  .sh-seg div.on{background:var(--panel2);border-color:var(--accent);color:var(--ink);font-weight:700}
  .sh-step{display:flex;align-items:center;gap:6px}
  .sh-step button{width:34px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:20px;cursor:pointer;flex-shrink:0}
  .sh-step .sh-in{flex:1}
  .sh-row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .sh-row2>*{min-width:0}
  .sh-step{min-width:0}
  .sh-srow{display:flex;align-items:center;gap:8px;margin:6px 0}
  .sh-srow .n{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sh-srow .sh-in{flex:0 0 96px} .sh-srow .sh-in input{font-size:15px;padding:8px 0}
  .sh-check{display:flex;align-items:center;gap:8px;font-size:13px;margin:14px 0 4px}
  .sh-check input{width:20px;height:20px}
  .h-row{cursor:pointer}
  .toast{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));background:#1d2636;border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;z-index:300;display:flex;gap:14px;align-items:center;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .toast button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:2px 4px}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .trend-daterange{display:flex;align-items:center;gap:6px;margin:2px 0 12px;flex-wrap:wrap}
  .trend-daterange.hidden{display:none}
  .trend-daterange input[type=text]{background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:5px 7px;font:inherit;font-size:12px;
    width:64px;text-align:center;letter-spacing:.05em}
  .trend-daterange span{color:var(--dim);font-size:12px}
  .trend-daterange button{font-size:11px;background:var(--panel2);border:1px solid var(--line);
    color:var(--muted);border-radius:6px;padding:5px 9px;cursor:pointer}
  .state-box .big{font-size:28px;margin-bottom:10px}
  .err-box{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.3);
    border-radius:12px;padding:16px;margin:16px;font-size:12px;color:#ff9a9d;line-height:1.6}

  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px}
  .chart-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .chart-title{font-size:12.5px;color:var(--muted);font-weight:600}
  .fold-btn{color:var(--dim);font-size:18px;padding:4px 8px;cursor:pointer;
    transition:transform .15s;flex-shrink:0;line-height:1}
  .fold-btn.closed{transform:rotate(-90deg)}
  .fold-body{margin-top:10px}
  .fold-body.hidden{display:none}
  .chart-box{position:relative;height:190px}
  #historyChart{touch-action:pan-y}   /* 좌우 드래그는 그래프가 처리, 위아래 스크롤은 그대로 허용 */

  .market-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mkt-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .mkt-k{font-size:10.5px;color:var(--dim)}
  .mkt-v{font-size:14px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .mkt-dd{font-size:11px;margin-top:2px;font-weight:600}

  .chip-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;
    -webkit-overflow-scrolling:touch}
  .chip-row::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;font-size:11.5px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
  .chip.active{background:rgba(76,141,255,.16);border-color:var(--accent);color:var(--accent);font-weight:600}

  .date-panel{display:flex;flex-wrap:wrap;align-items:center;gap:6px;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;margin-bottom:10px}
  .date-panel.hidden{display:none}
  .date-panel input[type=date]{background:var(--bg);border:1px solid var(--line);
    color:var(--ink);border-radius:6px;padding:4px 6px;font-size:11px;font-family:inherit;
    min-width:0;flex:1}
  .date-panel button{font-size:11px;background:var(--panel);border:1px solid var(--line);
    color:var(--muted);border-radius:6px;padding:5px 9px;cursor:pointer;flex-shrink:0}
  .date-panel button:first-of-type{background:var(--accent);border-color:var(--accent);
    color:#04101f;font-weight:600}

  .cmp-hint{font-size:10.5px;color:var(--dim);margin:-4px 0 8px}
  .compare-toggle-row{margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .compare-toggle{font-size:11px;color:var(--muted);background:var(--panel2);
    border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;
    text-align:center}
  .compare-toggle.equal-w{flex:0 0 auto;width:50px}
  .compare-toggle.active{background:rgba(76,141,255,.18);border-color:var(--accent);color:var(--accent)}
  .cmp-box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-top:8px;font-size:12px}
  .cmp-title{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:6px}
  .cmp-clear{color:var(--dim);cursor:pointer}
  .cmp-row{display:flex;justify-content:space-between;padding:2px 0}
  .cmp-total{display:flex;justify-content:space-between;padding-top:6px;margin-top:4px;
    border-top:1px solid var(--line);font-weight:700}

  .trend-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .trend-cell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:12px 8px;text-align:center}
  .trend-cell .sym{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:.03em}
  .trend-cell .lbl{font-size:13px;font-weight:700;margin-top:4px}
  .trend-cell .score{font-size:10px;color:var(--dim);margin-top:2px}
  .trend-cell.none{border-color:rgba(63,185,80,.35)}
  .trend-cell.watch{border-color:rgba(201,162,39,.4)}
  .trend-cell.sell{border-color:rgba(232,131,74,.45)}
  .trend-cell.strong{border-color:rgba(229,72,77,.5)}
  .trend-cell.none .lbl{color:var(--down)}
  .trend-cell.watch .lbl{color:var(--gold)}
  .trend-cell.sell .lbl{color:#e8834a}
  .trend-cell.strong .lbl{color:var(--up)}

  .trend-sel{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:12px;padding:7px 10px;border-radius:8px;margin-bottom:8px}
  .detail-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .detail-cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:8px 4px;text-align:center}
  .detail-cell .k{font-size:9.5px;color:var(--dim)}
  .detail-cell .v{font-size:11px;font-weight:700;margin-top:3px}
  .detail-cell .d{font-size:8.5px;color:var(--dim);margin-top:2px;line-height:1.3}
  .detail-cell.watch .v{color:var(--gold)}
  .detail-cell.sell .v{color:var(--up)}
  .detail-cell.locked{opacity:.45}

  .acct{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    margin-bottom:12px;overflow:hidden}
  .acct-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer}
  .acct-name{font-size:14px;font-weight:700}
  .acct-sub{font-size:11px;color:var(--dim);margin-top:2px}
  .thresh-btn{display:inline-block;font-size:10px;color:var(--dim);background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-top:5px;cursor:pointer}
  .thresh-row{display:flex;justify-content:space-between;align-items:center;
    padding:8px 10px;margin-bottom:6px;border-radius:8px;font-size:12px;
    background:var(--panel2);border-left:3px solid var(--line)}
  .thresh-row.csig-sell{border-left-color:var(--up)}
  .thresh-row.csig-sellwatch{border-left-color:#e8834a}
  .thresh-row.csig-hold{border-left-color:var(--muted)}
  .thresh-row.csig-buywatch{border-left-color:#7ee2a0}
  .thresh-row.csig-buy{border-left-color:var(--down)}

  .sig-badge{display:inline-block;font-size:14px;font-weight:700;padding:2px 8px;
    border-radius:999px;vertical-align:middle;margin-left:7px}
  .sig-sell{background:rgba(229,72,77,.18);color:#ff9a9d}
  .sig-sellwatch{background:rgba(232,131,74,.18);color:#f0b483}
  .sig-hold{background:rgba(154,166,184,.15);color:var(--muted)}
  .sig-buywatch{background:rgba(91,191,106,.18);color:#8fe0a0}
  .sig-buy{background:rgba(63,185,80,.2);color:#7ee2a0}

  .acct-sig-row{display:grid;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .acct-sig-row::-webkit-scrollbar{display:none}
  .acct-sig-cell{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    aspect-ratio:1/1;min-width:70px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:4px;overflow:hidden}
  .acct-sig-cell .nm{font-size:10.5px;color:var(--dim);font-weight:600;letter-spacing:.02em;
    line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .acct-sig-cell .lbl{font-size:12px;font-weight:700;margin-top:4px;line-height:1.15;
    white-space:nowrap}
  .acct-sig-cell .gap{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.15;white-space:nowrap}
  .acct-sig-cell.csig-sell{border-color:rgba(229,72,77,.5)}
  .acct-sig-cell.csig-sellwatch{border-color:rgba(232,131,74,.45)}
  .acct-sig-cell.csig-hold{border-color:rgba(154,166,184,.35)}
  .acct-sig-cell.csig-buywatch{border-color:rgba(91,191,106,.4)}
  .acct-sig-cell.csig-buy{border-color:rgba(63,185,80,.5)}
  .acct-sig-cell.csig-sell .lbl{color:var(--up)}
  .acct-sig-cell.csig-sellwatch .lbl{color:#e8834a}
  .acct-sig-cell.csig-hold .lbl{color:var(--muted)}
  .acct-sig-cell.csig-buywatch .lbl{color:#7ee2a0}
  .acct-sig-cell.csig-buy .lbl{color:var(--down)}

  .gap-row{display:flex;justify-content:space-between;padding:0 16px 10px;
    font-size:11.5px;color:var(--muted)}
  .gap-detail{display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--line);border-top:1px solid var(--line)}
  .gap-cell{background:var(--panel);padding:9px 16px}
  .gap-k{font-size:10px;color:var(--dim)}
  .gap-v{font-size:12px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .gap-pct{font-size:10px;font-weight:400;color:var(--dim);margin-left:4px}
  .acct-right{text-align:right}
  .acct-total{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .acct-profit{font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
  .acct-chev{color:var(--dim);font-size:11px;margin-left:8px;transition:transform .15s}
  .acct.open .acct-chev{transform:rotate(180deg)}
  .up{color:var(--up)} .down{color:var(--down)}

  .holdings{max-height:0;overflow:hidden;transition:max-height .25s ease}
  .acct.open .holdings{max-height:3000px}
  .pie-wrap{padding:14px 16px 4px;border-top:1px solid var(--line)}
  .pie-flex{display:flex;gap:10px;align-items:stretch}
  .pie-box{position:relative;height:180px;flex:1;min-width:0}
  .pie-legend{width:108px;flex-shrink:0;max-height:180px;overflow-y:auto;
    -webkit-overflow-scrolling:touch;padding-right:2px}
  .pie-legend::-webkit-scrollbar{width:3px}
  .pie-legend::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
  .pie-legend-row{display:flex;align-items:center;gap:6px;padding:3.5px 0;font-size:10px;color:var(--muted);cursor:pointer}
  .pie-legend-row.off{opacity:.4;text-decoration:line-through}
  .pie-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
  .pie-legend-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .h-row{display:flex;align-items:center;gap:10px;
    padding:9px 16px;border-top:1px solid var(--line);font-size:12px}
  .h-logo,.h-avatar{width:24px;height:24px;border-radius:6px;object-fit:contain;
    background:#fff;flex-shrink:0}
  .h-avatar{display:flex;align-items:center;justify-content:center;
    background:var(--panel2);color:var(--muted);font-size:11px;font-weight:700}
  .h-name{color:var(--ink);font-weight:600}
  .h-sub{color:var(--dim);font-size:10.5px;margin-top:1px}
  .h-mid{flex:1;min-width:0}
  .h-right{text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
  .h-val{color:var(--muted);font-size:10.5px}
  .h-rate{font-size:10.5px;font-weight:700;margin-top:1px}
  .h-empty{padding:14px 16px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}

  .grand{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    padding:16px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 20px}
  .grand .k{font-size:12px;color:var(--muted)}
  .grand .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}

  .footer-note{text-align:center;font-size:10.5px;color:var(--dim);margin-top:24px;line-height:1.7}

  #app{display:none}
  .page{display:none}
  .page.active{display:block}
  .stale-banner{display:none;margin:8px 12px 0;padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.55;
    background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.45);color:#ff9a9d}
</style>
</head>
<body>

<div id="loginScreen" class="wrap">
  <div class="brand-text">Rebalancer</div>
  <p>PC 리밸런서와 같은 구글 드라이브 데이터를<br>확인하고, 종목·계좌를 눌러 고칠 수 있습니다.</p>
  <div id="autoChecking" class="auto-checking">
    <div class="spinner"></div>
    <div>로그인 확인 중…</div>
  </div>
  <div id="loginBtnWrap" style="display:none;flex-direction:column;align-items:center">
    <button class="g-btn" onclick="login()">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.6H24v9.1h11.9c-.5 2.8-2.1 5.1-4.4 6.7v5.6h7.1c4.2-3.8 6.5-9.5 6.5-16.8z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.6c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 40.9 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.8 27.2c-.4-1.3-.7-2.7-.7-4.2s.2-2.9.7-4.2v-5.7H4.5C3 16 2 19.9 2 24s1 8 4.5 10.9l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.4 2 8.1 7.1 4.5 13.1l7.3 5.7c1.7-5.2 6.5-9 12.2-9.1z"/></svg>
      구글로 로그인
    </button>
    <div class="scope-note">저장 버튼을 누를 때만 구글 드라이브에 씁니다. 평소에는 읽기만 합니다.</div>
  </div>
</div>

<div id="app">
  <header>
    <div>
      <h1>리밸런서</h1>
      <div class="sub" id="updatedAt">불러오는 중…</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="icon-btn" id="editBtn" onclick="openSettingsSheet()" title="설정">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
      </div>
      <div class="icon-btn" id="refreshBtn" onclick="loadPortfolio()" title="새로고침">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      </div>
    </div>
  </header>

  <div id="staleBanner" class="stale-banner"></div>
  <div class="tabbar">
    <div class="tab-btn active" id="tab-summary" onclick="switchTab('summary')">요약</div>
    <div class="tab-btn" id="tab-accounts" onclick="switchTab('accounts')">계좌</div>
  </div>

  <div class="wrap">
    <div id="page-summary" class="page active"></div>
    <div id="page-accounts" class="page"></div>
  </div>
</div>

<script>
// ▼ 모바일용 구글 클라이언트 ID.
//   가이드의 '준비 3'(PC와 같은 프로젝트에 웹 클라이언트 ID 추가)을 했다면 그 새 ID로 바꾸세요.
//   PC와 같은 프로젝트(번호 285079439677)의 ID로 바뀌면 권한이 자동으로
//   '드라이브 전체' → '리밸런서가 만든 파일만'(drive.file)으로 줄어듭니다.
const CLIENT_ID = '155085390291-minre2sngn71m9rsjdnssrmlc0u2178q.apps.googleusercontent.com';
const PC_PROJECT_NUMBER = '285079439677';
const NARROW_SCOPE = CLIENT_ID.startsWith(PC_PROJECT_NUMBER + '-');
const SCOPE = (NARROW_SCOPE ? 'https://www.googleapis.com/auth/drive.file' : 'https://www.googleapis.com/auth/drive')
  + ' https://www.googleapis.com/auth/userinfo.email';
const FOLDER_NAME = 'Rebalancer';
const FILE_NAME = 'portfolio.json';
const PRICES_NAME = 'prices.json';

// 글자를 HTML 에 넣기 전에 꼭 거치는 함수 (계좌·종목 이름에 < > " 등이 있어도 안전)
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsa = v => esc(JSON.stringify(v));   // onclick="f(${jsa(값)})"

// ---- 데이터는 두 파일: portfolio.json(사람이 고침) + prices.json(자동 시세) ----
// 화면은 두 파일을 합친 DATA 를 쓰고, 저장할 때는 portfolio 부분만 떼어 portfolio.json 에 쓴다.
// (core.py 의 merge_view / extract_portfolio 와 같은 규칙)
const QUOTE_FIELDS = ['price','preMarketPrice','preMarketChangePercent','postMarketPrice','postMarketChangePercent',
  'afterHoursPrice','afterHoursChangePercent','marketState'];
const PRICES_KEYS = ['market','quotes','hist','histFetched','trendSignals','trendHistory','history','updatedAt'];
const LEGACY_KEYS = ['qqq','qqqSignals'];
let PORTFOLIO_RAW = null, PRICES_RAW = null;
let portfolioModified = null, pricesFileId = null, pricesModified = null, folderId = null;

function qkey(h){
  const code = String(h.code||'').trim().toUpperCase();
  return h.market === 'US' ? 'US:' + code : 'KR:' + code.padStart(6, '0');
}
function isMigrated(p){ return !!p && p.version === 2 && (p.accounts||[]).every(a => a.id); }
function applyQuote(h, q){
  if (!q) return;
  QUOTE_FIELDS.forEach(f => { if (q[f] != null) h[f] = q[f]; else delete h[f]; });
  const code = String(h.code||'').trim(), nm = String(h.name||'').trim();
  if (q.name && (!nm || nm.toUpperCase() === code.toUpperCase())) h.name = q.name;
  let cands = (q.logos || []).slice();
  if (h.logoPinned && h.logo) cands = [h.logo, ...cands.filter(c => c !== h.logo)];
  else if (cands.length) h.logo = cands[0];
  if (cands.length) h.logos = cands;
}
function mergeView(p, pr){
  const v = JSON.parse(JSON.stringify(p || {}));
  pr = pr || {};
  ['market','trendSignals','trendHistory','history','updatedAt'].forEach(k => { if (pr[k] !== undefined) v[k] = JSON.parse(JSON.stringify(pr[k])); });
  v.market = v.market || {}; v.history = v.history || [];
  const quotes = pr.quotes || {};
  (v.accounts || []).forEach(a => (a.holdings || []).forEach(h => applyQuote(h, quotes[qkey(h)])));
  return v;
}
function extractPortfolio(view){
  const p = JSON.parse(JSON.stringify(view || {}));
  Object.keys(p).forEach(k => { if (PRICES_KEYS.includes(k) || LEGACY_KEYS.includes(k) || k.startsWith('_')) delete p[k]; });
  (p.accounts || []).forEach(a => (a.holdings || []).forEach(h => {
    QUOTE_FIELDS.concat(['logos','logoVer']).forEach(f => delete h[f]);
    if (!h.logoPinned) delete h.logo;
  }));
  p.version = 2;
  return p;
}
// 수익 기록은 계좌 id 로 저장(이름을 바꿔도 그래프가 이어짐). 예전 기록은 이름으로도 찾는다.
function profitOf(row, acc){
  const p = (row && row.profits) || {};
  if (p[acc.id] != null) return p[acc.id];
  return p[acc.name] != null ? p[acc.name] : null;
}
function newAccountId(){
  const ids = new Set((DATA.accounts || []).map(a => a.id)); let id;
  do { id = 'a' + Math.random().toString(36).slice(2, 9); } while (ids.has(id) || id.length < 8);
  return id;
}

let tokenClient = null;
let accessToken = null;
let DATA = null;
let currentFileId = null;
let openAccts = {};
let charts = {};
let activeTab = 'summary';

// =====================================================================
//  수정: 종목·계좌를 누르면 아래에서 올라오는 작은 창에서 그것만 고치고,
//  저장할 때 "Drive 의 최신 portfolio.json" 위에 바뀐 부분만 얹어서 저장한다.
//  (그 사이 PC 에서 고친 다른 내용이 있어도 덮어쓰지 않고 함께 남는다)
// =====================================================================
let SH = null, _toastTimer = null, _undoFn = null;
const $id = id => document.getElementById(id);
const findAcc = (d, id) => (d.accounts || []).find(a => a.id === id);
const findH = (a, key) => (a.holdings || []).find(h => qkey(h) === key);
const clone = o => JSON.parse(JSON.stringify(o));

function fnum(s){                       // '1,234.5' → 1234.5 / 빈칸·잘못된 입력 → NaN
  const t = String(s == null ? '' : s).replace(/,/g, '').trim();
  if (!/^\d*\.?\d*$/.test(t) || t === '' || t === '.') return NaN;
  return parseFloat(t);
}
function groupNum(s){                   // 입력하는 동안 쉼표 자동
  s = String(s).replace(/[^\d.]/g, '');
  const i = s.indexOf('.');
  let a = i < 0 ? s : s.slice(0, i);
  const b = i < 0 ? '' : s.slice(i + 1).replace(/\./g, '');
  a = a.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return i < 0 ? a : a + '.' + b;
}
const numStr = n => (n == null || isNaN(n)) ? '' : groupNum(String(n));
const r4 = x => Math.round(x * 10000) / 10000;

// ---- Drive 최신본 위에 변경만 얹어 저장 ----
async function commit(mut){
  for (let n = 0; n < 3; n++) {
    const files = await listDataFiles();
    const f = files[FILE_NAME];
    if (!f) throw new Error('portfolio.json 을 찾지 못했습니다');
    const raw = await driveFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
    currentFileId = f.id; portfolioModified = f.modifiedTime; PORTFOLIO_RAW = raw;
    const base = mergeView(raw, PRICES_RAW);
    mut(base);                           // 대상이 없으면 여기서 오류
    const prev = DATA; DATA = base;
    try { await driveSave(); setUpdatedLabel(); render(); return; }
    catch(e) { DATA = prev; if (!e.conflict) throw e; }   // 그 사이 또 바뀌었으면 최신본으로 한 번 더
  }
  throw new Error('다른 기기에서 계속 저장 중입니다. 잠시 뒤 다시 시도해주세요.');
}

// ---- 시트 틀 ----
function openSheet(st){
  closeSheetNow();
  const _t = $id('toast'); if (_t) { _t.remove(); clearTimeout(_toastTimer); }
  SH = st; st.init = JSON.stringify(st.v);
  const ov = document.createElement('div');
  ov.id = 'sheet'; ov.className = 'sheet-ov';
  ov.addEventListener('click', e => { if (e.target === ov) shClose(); });
  ov.innerHTML = `<div class="sheet" role="dialog">
    <div class="sheet-head"><div class="sheet-title">${st.title}</div><div class="sheet-x" onclick="shClose()">✕</div></div>
    <div class="sheet-body" id="shBody">${st.body()}</div>
    <div class="sheet-foot">${st.foot ? st.foot() : `<button class="sh-btn sec" onclick="shClose()">닫기</button><button class="sh-btn pri" id="shSave" onclick="shSave()">저장</button>`}</div>
  </div>`;
  document.body.appendChild(ov);
  st.upd && st.upd();
}
function closeSheetNow(){ const s = $id('sheet'); if (s) s.remove(); SH = null; }
function shDirty(){ return !!SH && JSON.stringify(SH.v) !== SH.init; }
function shClose(){
  if (!SH || SH.busy) return;
  if (shDirty() && !confirm('저장하지 않고 닫을까요?')) return;
  closeSheetNow();
}
function shBusy(b){
  const btn = $id('shSave'); if (!btn) return;
  btn.disabled = b; btn.textContent = b ? '저장 중…' : '저장';
}
async function shRun(r){                // r = {mut, undo, msg}
  const st = SH; if (!st || st.busy) return;
  st.busy = true; shBusy(true);
  try { await commit(r.mut); closeSheetNow(); toast(r.msg, r.undo); }
  catch(e) { st.busy = false; shBusy(false); alert('저장 실패: ' + (e.message || String(e)) + '\n입력한 내용은 그대로 있으니 다시 눌러 재시도해주세요.'); if (st.upd) st.upd(); }
}
function shSave(){
  if (!SH || SH.busy) return;
  if (!shDirty()) { closeSheetNow(); return; }
  const r = SH.collect(); if (!r) return;
  if (r.warn) { _pendingWeightConfirm = () => shRun(r); showWeightWarningModal(); return; }
  shRun(r);
}
function shIn(el, k){                    // 숫자 칸 입력
  el.value = groupNum(el.value); SH.v[k] = el.value; SH.upd();
}
function shPick(k, val){ SH.v[k] = val; SH.upd(); }

function toast(msg, undoMut){
  clearTimeout(_toastTimer);
  const old = $id('toast'); if (old) old.remove();
  const t = document.createElement('div'); t.id = 'toast'; t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>` + (undoMut ? `<button onclick="doUndo()">되돌리기</button>` : '');
  document.body.appendChild(t);
  _undoFn = undoMut || null;
  _toastTimer = setTimeout(() => { t.remove(); _undoFn = null; }, 8000);
}
async function doUndo(){
  const u = _undoFn; _undoFn = null;
  const t = $id('toast'); if (t) t.remove();
  if (!u) return;
  try { await commit(u); toast('되돌렸어요'); }
  catch(e) { alert('되돌리기 실패: ' + (e.message || String(e))); }
}

// ---- 종목 창 : 남은 수량 + 평단가 ----
function openItemSheet(accId, hi){
  const acc = findAcc(DATA, accId), h = acc && acc.holdings[hi]; if (!h) return;
  const key = qkey(h), isUS = h.market === 'US';
  const fx = (DATA.market && DATA.market.usdKrw) || 0, price = +h.price || 0;
  const old = { qty: h.qty || 0, avg: h.avgPrice || 0, sector: h.sector || '' };
  const hcopy = clone(h), idx = hi;
  const sectors = (DATA.sectors || []).map(x => x.name);
  const fq = n => groupNum(String(n)) + '주';
  const fa = n => isUS ? '$' + numUS(n) : won(n) + '원';
  const val = q => q * price * (isUS ? fx : 1);
  const rate = a => (a > 0 && price > 0) ? price / a - 1 : null;
  const cls = r => r == null ? '' : (r >= 0 ? 'up' : 'down');
  const target = d => { const A = findAcc(d, accId), H = A && findH(A, key); if (!H) throw new Error('다른 기기에서 이미 지워진 종목이에요'); return [A, H]; };
  openSheet({
    title: esc(h.name || h.code), v: { qty: numStr(old.qty), avg: numStr(old.avg), sector: old.sector },
    body(){ return `
      <div class="sh-sub">${isUS ? '미장' : '국장'} · ${esc(h.code)} · ${esc(acc.name)}</div>
      <div class="sh-field"><label>남은 수량</label>
        <div class="sh-in" id="shQ"><input inputmode="decimal" autocomplete="off" value="${esc(this.v.qty)}" oninput="shIn(this,'qty')"><span class="u">주</span></div></div>
      <div class="sh-field"><label>평단가</label>
        <div class="sh-in" id="shA"><input inputmode="decimal" autocomplete="off" value="${esc(this.v.avg)}" oninput="shIn(this,'avg')"><span class="u">${isUS ? '$' : '원'}</span></div>
        <div class="sh-err" id="shErr"></div></div>
      <div class="sh-pv" id="shPv"></div>
      <div class="sh-more">
        <span>섹터 <select onchange="shPick('sector',this.value)"><option value="">미지정</option>${sectors.map(n => `<option value="${esc(n)}" ${n === this.v.sector ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></span>
        <span class="sh-link danger" onclick="shDel()">종목 삭제</span>
      </div>`; },
    upd(){
      const q = fnum(this.v.qty), a = fnum(this.v.avg);
      const qOk = !isNaN(q), aOk = !isNaN(a) && (a > 0 || q === 0);
      $id('shQ').classList.toggle('bad', !qOk); $id('shA').classList.toggle('bad', !aOk);
      $id('shErr').textContent = !qOk ? '수량을 숫자로 입력해 주세요' : (!aOk ? '평단가를 숫자로 입력해 주세요' : '');
      const q2 = qOk ? q : old.qty, a2 = aOk ? a : old.avg;
      const r0 = rate(old.avg), r1 = rate(a2);
      $id('shPv').innerHTML = `
        <div class="r"><span class="k">수량</span><span class="a">${fq(old.qty)}</span><span class="ar">→</span><span class="b">${fq(q2)}</span></div>
        <div class="r"><span class="k">평단가</span><span class="a">${fa(old.avg)}</span><span class="ar">→</span><span class="b">${fa(a2)}</span></div>
        <div class="r"><span class="k">평가금액</span><span class="a">${won(val(old.qty))}원</span><span class="ar">→</span><span class="b">${won(val(q2))}원</span></div>
        <div class="r"><span class="k">수익률</span><span class="a ${cls(r0)}">${pct(r0)}</span><span class="ar">→</span><span class="b ${cls(r1)}">${pct(r1)}</span></div>`;
      $id('shSave').disabled = !(qOk && aOk) || !!this.busy;
    },
    collect(){
      const q = fnum(this.v.qty), a = fnum(this.v.avg), sec = this.v.sector;
      if (isNaN(q) || isNaN(a)) return null;
      return { msg: '저장했어요',
        mut: d => { const H = target(d)[1]; H.qty = q; H.avgPrice = a; if (sec || 'sector' in H) H.sector = sec; },
        undo: d => { const H = target(d)[1]; H.qty = old.qty; H.avgPrice = old.avg; if (old.sector || 'sector' in H) H.sector = old.sector; } };
    },
    del(){
      return { msg: '종목을 삭제했어요',
        mut: d => { const [A, H] = target(d); A.holdings.splice(A.holdings.indexOf(H), 1); },
        undo: d => { const A = findAcc(d, accId); if (!A) throw new Error('계좌가 없어졌어요'); A.holdings.splice(Math.min(idx, A.holdings.length), 0, clone(hcopy)); } };
    }
  });
}
function shDel(){
  if (!SH || !SH.del || SH.busy) return;

  if (!confirm(isAcct ? '이 계좌를 삭제할까요?\n이 계좌의 종목·설정이 모두 사라집니다.' : '이 종목을 삭제할까요?')) return;

// ---- 종목 추가 ----
function detectMarket(code){ return /^\d[0-9A-Z]{5}$/.test(code) ? 'KR' : 'US'; }
function openAddSheet(accId){
  const acc = findAcc(DATA, accId); if (!acc) return;
  const have = new Set((acc.holdings || []).map(qkey));
  const others = []; const seen = new Set();
  (DATA.accounts || []).forEach(a => { if (a.id === accId) return; (a.holdings || []).forEach(h => {
    const k = qkey(h); if (have.has(k) || seen.has(k)) return; seen.add(k);
    others.push({ market: h.market, code: h.code, name: h.name || '', sector: h.sector || '' }); }); });
  const sectors = (DATA.sectors || []).map(x => x.name);
  openSheet({
    title: esc(acc.name) + ' · 종목 추가', v: { code: '', market: 'KR', auto: true, qty: '', avg: '', sector: '' }, name: '',
    body(){ return `
      ${others.length ? `<div class="sh-field"><label>다른 계좌에 있는 종목 (누르면 채워져요)</label><div class="sh-chips">${
        others.map((o, i) => `<span class="sh-chip" onclick="shAddPick(${i})">${esc(o.name || o.code)}</span>`).join('')}</div></div>` : ''}

        <div class="sh-in" id="shC"><input id="shCode" autocapitalize="characters" autocomplete="off" placeholder="예 005930 / NVDA" value="${esc(this.v.code)}" oninput="shAddCode(this)"></div>
        <div class="sh-err" id="shErr"></div></div>
      <div class="sh-seg" id="shSeg"><div id="shMK" onclick="shAddMkt('KR')">국장</div><div id="shMU" onclick="shAddMkt('US')">미장</div></div>
      <div class="sh-row2">
        <div class="sh-field"><label>수량</label><div class="sh-in" id="shQ"><input inputmode="decimal" autocomplete="off" value="${esc(this.v.qty)}" oninput="shIn(this,'qty')"><span class="u">주</span></div></div>
        <div class="sh-field"><label>평단가</label><div class="sh-in" id="shA"><input inputmode="decimal" autocomplete="off" value="${esc(this.v.avg)}" oninput="shIn(this,'avg')"><span class="u" id="shAu">원</span></div></div>
      </div>
      <div class="sh-more"><span>섹터 <select onchange="shPick('sector',this.value)"><option value="">미지정</option>${sectors.map(n => `<option value="${esc(n)}" ${n === this.v.sector ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></span>
        <span style="font-size:11px">시세는 몇 분 안에 자동으로 채워져요</span></div>`; },
    upd(){
      const v = this.v, q = fnum(v.qty), a = fnum(v.avg);
      const code = v.code.trim().toUpperCase();
      const dup = code && have.has(v.market + ':' + code);
      const codeOk = /^[0-9A-Z.\-]{1,12}$/.test(code) && !dup;
      const qOk = !isNaN(q), aOk = !isNaN(a) && (a > 0 || q === 0);
      $id('shC').classList.toggle('bad', !!v.code && !codeOk);
      $id('shErr').textContent = dup ? '이 계좌에 이미 있는 종목이에요' : (v.code && !codeOk ? '종목코드를 확인해 주세요' : '');
      $id('shQ').classList.toggle('bad', v.qty !== '' && !qOk);
      $id('shA').classList.toggle('bad', v.avg !== '' && !aOk);
      $id('shMK').classList.toggle('on', v.market === 'KR'); $id('shMU').classList.toggle('on', v.market === 'US');
      $id('shAu').textContent = v.market === 'US' ? '$' : '원';
      $id('shSave').disabled = !(codeOk && qOk && aOk) || !!this.busy;
    },
    collect(){
      const v = this.v, q = fnum(v.qty), a = fnum(v.avg), code = v.code.trim().toUpperCase(), market = v.market, sec = v.sector, nm = this.name;
      if (!code || isNaN(q) || isNaN(a)) return null;
      const key = market + ':' + code;
      return { msg: '종목을 추가했어요',
        mut: d => { const A = findAcc(d, accId); if (!A) throw new Error('계좌가 없어졌어요');
          if (A.holdings.some(h => qkey(h) === key)) throw new Error('이미 같은 종목이 있어요');
          const h = { market, code, name: nm, qty: q, avgPrice: a }; if (sec) h.sector = sec; A.holdings.push(h); },
        undo: d => { const A = findAcc(d, accId); if (!A) return; const i = A.holdings.findIndex(h => qkey(h) === key); if (i >= 0) A.holdings.splice(i, 1); } };

function shAddCode(el){
  el.value = el.value.toUpperCase().replace(/[^0-9A-Z.\-]/g, '');
  SH.v.code = el.value; SH.name = '';
  if (SH.v.auto) SH.v.market = detectMarket(el.value);
  SH.upd();
}
function shAddMkt(m){ SH.v.market = m; SH.v.auto = false; SH.upd(); }
function shAddPick(i){
  const o = SH.others[i]; if (!o) return;
  SH.v.code = o.code; SH.v.market = o.market; SH.v.auto = false; SH.v.sector = o.sector; SH.name = o.name;

// ---- 계좌 설정 ----
const TH_DEF = { sell: 6, sellWatch: 3, buyWatch: 3, buy: 6 };   // 화면에서는 모두 양수(하락은 − 로 표시)
function openAcctSheet(accId){
  const acc = findAcc(DATA, accId); if (!acc) return;
  const ai = DATA.accounts.indexOf(acc);
  const th = acc.thresholds || {};
  const P = (k, sign) => th[k] != null ? r4(Math.abs(th[k]) * 100) : TH_DEF[k];
  const snap = { name: acc.name, seed: acc.seed || 0, cashKRW: acc.cashKRW || 0, cashUSD: acc.cashUSD || 0, krOnly: !!acc.krOnly, thresholds: clone(acc.thresholds || {}) };
  const acopy = clone(extractPortfolio({ accounts: [acc] }).accounts[0]);
  function field(label, k, unit){ return `<div class="sh-field"><label>${label}</label><div class="sh-in" id="shF_${k}"><input inputmode="decimal" autocomplete="off" value="${esc(this.v[k])}" oninput="shIn(this,'${k}')"><span class="u">${unit}</span></div></div>`; }
  function step(label, k, minus){ return `<div class="sh-field"><label>${label}</label><div class="sh-step">
      <button type="button" onclick="shStep('${k}',-0.5)">−</button>
      <div class="sh-in" id="shF_${k}">${minus ? '<span class="p">−</span>' : '<span class="p">+</span>'}<input id="shI_${k}" inputmode="decimal" autocomplete="off" value="${esc(this.v[k])}" oninput="shIn(this,'${k}')"><span class="u">%</span></div>
      <button type="button" onclick="shStep('${k}',0.5)">＋</button></div></div>`; }
  const target = d => { const A = findAcc(d, accId); if (!A) throw new Error('다른 기기에서 이미 지워진 계좌예요'); return A; };
  openSheet({
    title: esc(acc.name) + ' · 계좌 설정',
    v: { name: acc.name, seed: numStr(snap.seed), cashKRW: numStr(snap.cashKRW), cashUSD: numStr(snap.cashUSD), krOnly: snap.krOnly,
         sell: String(P('sell')), sellWatch: String(P('sellWatch')), buyWatch: String(P('buyWatch')), buy: String(P('buy')) },
    body(){ return `
      <div class="sh-field"><label>계좌 이름</label><div class="sh-in" id="shF_name"><input autocomplete="off" value="${esc(this.v.name)}" oninput="SH.v.name=this.value;SH.upd()"></div></div>
      ${field.call(this, '시드 (원)', 'seed', '원')}
      <div class="sh-row2">${field.call(this, '예수금 ₩', 'cashKRW', '원')}${field.call(this, '예수금 $', 'cashUSD', '$')}</div>
      <label class="sh-check"><input type="checkbox" ${this.v.krOnly ? 'checked' : ''} onchange="SH.v.krOnly=this.checked;SH.upd()"> 국장 전용 계좌</label>
      <div class="sh-sec">매매 기준 (0.5%p씩 조절)</div>
      <div class="sh-row2">${step.call(this, '매도', 'sell', false)}${step.call(this, '매도 고려', 'sellWatch', false)}</div>
      <div class="sh-row2">${step.call(this, '매수 고려', 'buyWatch', true)}${step.call(this, '매수', 'buy', true)}</div>
      <div class="sh-err" id="shErr"></div>
      <div class="sh-more"><span></span><span class="sh-link danger" onclick="shDel()">계좌 삭제</span></div>`; },
    upd(){
      const v = this.v, num = k => fnum(v[k]);
      const bad = {};
      ['seed', 'cashKRW', 'cashUSD', 'sell', 'sellWatch', 'buyWatch', 'buy'].forEach(k => { bad[k] = isNaN(num(k)); });
      bad.name = !v.name.trim();
      let msg = '';
      if (!bad.sell && !bad.sellWatch && num('sellWatch') > num('sell')) { bad.sell = bad.sellWatch = true; msg = '매도 기준은 매도 고려 기준보다 크거나 같아야 해요'; }
      if (!bad.buy && !bad.buyWatch && num('buyWatch') > num('buy')) { bad.buy = bad.buyWatch = true; msg = '매수 기준은 매수 고려 기준보다 크거나 같아야 해요 (둘 다 하락폭)'; }
      Object.keys(bad).forEach(k => { const e = $id('shF_' + k); if (e) e.classList.toggle('bad', !!bad[k]); });
      $id('shErr').textContent = msg;
      $id('shSave').disabled = Object.values(bad).some(Boolean) || !!this.busy;
    },
    collect(){
      const v = this.v, n = k => fnum(v[k]);
      const t = { sell: r4(n('sell') / 100), sellWatch: r4(n('sellWatch') / 100), buyWatch: -r4(n('buyWatch') / 100), buy: -r4(n('buy') / 100) };
      const nm = v.name.trim(), ko = !!v.krOnly, seed = n('seed'), kr = n('cashKRW'), us = n('cashUSD');
      return { msg: '계좌 설정을 저장했어요',
        mut: d => { const A = target(d); A.name = nm; A.seed = seed; A.cashKRW = kr; A.cashUSD = us; A.krOnly = ko; A.thresholds = t; },
        undo: d => { const A = target(d); A.name = snap.name; A.seed = snap.seed; A.cashKRW = snap.cashKRW; A.cashUSD = snap.cashUSD; A.krOnly = snap.krOnly; A.thresholds = clone(snap.thresholds); } };
    },
    del(){
      return { msg: '계좌를 삭제했어요',
        mut: d => { const A = target(d); d.accounts.splice(d.accounts.indexOf(A), 1); },
        undo: d => { d.accounts.splice(Math.min(ai, d.accounts.length), 0, clone(acopy)); } };
    }
  });
}
function shStep(k, delta){
  const cur = fnum(SH.v[k]); const base = isNaN(cur) ? 0 : cur;
  SH.v[k] = String(Math.max(0, r4(base + delta)));
  const el = $id('shI_' + k); if (el) el.value = SH.v[k];
  SH.upd();
}
// ---- 설정 창 (전략 · 섹터 목표 · 계좌 추가) ----
function openSettingsSheet(){
  if (!DATA) return;
  const st = DATA.settings || {};
  const pc = x => x != null ? String(r4(x * 100)) : '';
  const snapSettings = clone(st), snapSectors = clone(DATA.sectors || []);
  const nw0 = st.nasdaqWeight != null ? st.nasdaqWeight : 0.85, kw0 = st.kospiWeight != null ? st.kospiWeight : 0.25;
  openSheet({
    title: '설정',
    v: { peak: pc(st.peakStockRatio), dom: pc(st.domesticTargetRatio), mdd: pc(st.maxDrawdownAssumption), nw: String(nw0), kw: String(kw0),
         sectors: snapSectors.map(s => ({ name: s.name, target: String(s.target != null ? s.target : 0) })), newSector: '' },
    body(){ const self = this; const ff = (label, k, unit) => `<div class="sh-field"><label>${label}</label><div class="sh-in" id="shF_${k}"><input inputmode="decimal" autocomplete="off" value="${esc(self.v[k])}" oninput="SH.v.${k}=this.value;SH.upd()"><span class="u">${unit}</span></div></div>`;
      return `
      <div class="sh-sec" style="margin-top:6px">전략</div>
      ${ff('최고점 기준 주식비중', 'peak', '%')}${ff('국장 목표 배분', 'dom', '%')}${ff('최대 낙폭 가정', 'mdd', '%')}
      <div class="sh-row2">${ff('나스닥 가중치', 'nw', '')}${ff('코스피 가중치', 'kw', '')}</div>
      <div class="cmp-hint">나스닥·코스피 가중치를 바꾸면 저장 전에 경고가 떠요</div>
      <div class="sh-sec">섹터 목표 비중</div>
      ${this.v.sectors.map((s, i) => `<div class="sh-srow"><span class="n">${esc(s.name)}</span>
        <div class="sh-in" id="shS_${i}"><input inputmode="decimal" autocomplete="off" value="${esc(s.target)}" oninput="SH.v.sectors[${i}].target=this.value;SH.upd()"><span class="u">%</span></div>
        <span class="ef-del" onclick="shSecDel(${i})">✕</span></div>`).join('')}
      <div class="sh-srow"><div class="sh-in" style="flex:1"><input autocomplete="off" placeholder="새 섹터 이름" value="${esc(this.v.newSector)}" oninput="SH.v.newSector=this.value"></div>
        <button class="edit-mini-btn save" type="button" onclick="shSecAdd()">추가</button></div>
      <div class="sh-sec">계좌</div>
      <button class="ef-add-btn" style="margin-top:0" type="button" onclick="shAddAcct()">＋ 새 계좌 추가</button>`; },
    upd(){
      const v = this.v; let bad = false;
      ['peak', 'dom', 'mdd'].forEach(k => { const b = v[k].trim() !== '' && isNaN(fnum(v[k])); bad = bad || b; const e = $id('shF_' + k); if (e) e.classList.toggle('bad', b); });
      ['nw', 'kw'].forEach(k => { const b = isNaN(fnum(v[k])); bad = bad || b; const e = $id('shF_' + k); if (e) e.classList.toggle('bad', b); });
      v.sectors.forEach((s, i) => { const b = isNaN(fnum(s.target)) || fnum(s.target) > 100; bad = bad || b; const e = $id('shS_' + i); if (e) e.classList.toggle('bad', b); });
      $id('shSave').disabled = bad || !!this.busy;
    },
    collect(){
      const v = this.v, n = k => fnum(v[k]);
      const peak = v.peak.trim() === '' ? null : n('peak') / 100, dom = v.dom.trim() === '' ? null : n('dom') / 100, mdd = v.mdd.trim() === '' ? null : n('mdd') / 100;
      const nw = n('nw'), kw = n('kw');
      const sectors = v.sectors.map(s => ({ name: s.name, target: fnum(s.target) }));
      const names = new Set(sectors.map(s => s.name));
      const removed = snapSectors.filter(s => !names.has(s.name)).map(s => s.name);
      const held = []; (DATA.accounts || []).forEach(a => (a.holdings || []).forEach(h => { if (removed.includes(h.sector)) held.push([a.id, qkey(h), h.sector]); }));
      const warn = nw !== nw0 || kw !== kw0;
      return { warn, msg: '설정을 저장했어요',
        mut: d => {
          d.settings = d.settings || {};
          if (peak != null) d.settings.peakStockRatio = r4(peak); if (dom != null) d.settings.domesticTargetRatio = r4(dom); if (mdd != null) d.settings.maxDrawdownAssumption = r4(mdd);
          d.settings.nasdaqWeight = nw; d.settings.kospiWeight = kw;
          const prev = d.sectors || [];
          d.sectors = sectors.map(s => Object.assign({}, prev.find(p => p.name === s.name) || {}, s));
          if (removed.length) (d.accounts || []).forEach(a => (a.holdings || []).forEach(h => { if (removed.includes(h.sector)) h.sector = ''; }));
        },
        undo: d => {
          d.settings = clone(snapSettings); d.sectors = clone(snapSectors);
          held.forEach(([aid, k, sec]) => { const A = findAcc(d, aid), H = A && findH(A, k); if (H) H.sector = sec; });
        } };
    }
  });
}

async function shAddAcct(){
  if (!SH || SH.busy) return;

function initGoogle(){
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: (resp) => {
      clearTimeout(autoLoginTimeout);
      if (resp.error) { setAutoChecking(false); return; }
      accessToken = resp.access_token;
      rememberAccountHint();
      showApp();
      loadPortfolio();
    }
  });
  const savedHint = localStorage.getItem('g_hint_email') || undefined;
  setAutoChecking(true);
  tokenClient.requestAccessToken({ prompt: '', hint: savedHint });
  autoLoginTimeout = setTimeout(() => setAutoChecking(false), 4000);
}

async function rememberAccountHint(){
  try{
    const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    if (!r.ok) return;
    const info = await r.json();
    if (info.email) localStorage.setItem('g_hint_email', info.email);
  } catch(e){}
}

let autoLoginTimeout = null;
function setAutoChecking(on){
  const btn = document.getElementById('loginBtnWrap');
  const checking = document.getElementById('autoChecking');
  if (btn) btn.style.display = on ? 'none' : 'flex';
  if (checking) checking.style.display = on ? 'block' : 'none';
}

function login(){
  const savedHint = localStorage.getItem('g_hint_email') || undefined;
  tokenClient.requestAccessToken({ prompt: 'consent', hint: savedHint });
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function switchTab(tab){
  activeTab = tab;
  document.getElementById('tab-summary').classList.toggle('active', tab==='summary');
  document.getElementById('tab-accounts').classList.toggle('active', tab==='accounts');
  document.getElementById('page-summary').classList.toggle('active', tab==='summary');
  document.getElementById('page-accounts').classList.toggle('active', tab==='accounts');
  if (tab==='summary'){ renderHistoryChart(); renderRatioChart(); renderSectorChart(); if(!isFolded('trendDetail')) renderTrendDetail(); }
  else { renderAllPies(); }
}

async function driveFetch(url, retried){
  const r = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (r.status === 401) {
    if (!retried) {
      const refreshed = await silentRefresh();
      if (refreshed) return driveFetch(url, true);
    }
    throw new Error('로그인이 만료됐습니다. 다시 로그인해주세요.');
  }
  if (!r.ok) throw new Error('구글 드라이브 요청 실패 (' + r.status + ')');
  return r.json();
}

function silentRefresh(){
  return new Promise((resolve) => {
    const prevCb = tokenClient.callback;
    tokenClient.callback = (resp) => {
      tokenClient.callback = prevCb;
      if (resp.error) { resolve(false); return; }
      accessToken = resp.access_token;
      resolve(true);
    };
    const savedHint = localStorage.getItem('g_hint_email') || undefined;
    tokenClient.requestAccessToken({ prompt: '', hint: savedHint });
  });
}

// 쓰기 권한이 새로 추가된 경우, 기존 로그인은 여전히 읽기 전용 토큰일 수 있다.
// 조용한(prompt:'') 갱신으로는 새 권한을 절대 못 받으므로, 동의 화면을 직접 띄워
// 확실하게 쓰기 권한을 새로 받는다.
function interactiveWriteConsent(){
  return new Promise((resolve) => {
    const prevCb = tokenClient.callback;
    tokenClient.callback = (resp) => {
      tokenClient.callback = prevCb;
      if (resp.error) { resolve(false); return; }
      accessToken = resp.access_token;
      resolve(true);
    };
    tokenClient.requestAccessToken({ prompt: 'consent' });
  });
}

async function driveSave(opts){
  opts = opts || {};
  if (!currentFileId) throw new Error('파일 정보를 아직 찾지 못했습니다. 새로고침 후 다시 시도해주세요.');
  if (!isMigrated(PORTFOLIO_RAW)) throw new Error('PC 리밸런서 새 버전을 먼저 한 번 실행해 주세요(데이터 형식 변환이 필요합니다).');
  if (!opts.overwrite && portfolioModified) {
    const meta = await driveFetch(`https://www.googleapis.com/drive/v3/files/${currentFileId}?fields=modifiedTime`);
    if (meta.modifiedTime !== portfolioModified) { const e = new Error('다른 기기에서 먼저 저장함'); e.conflict = true; throw e; }
  }
  const body = JSON.stringify(extractPortfolio(DATA));
  const res = await driveWrite(`https://www.googleapis.com/upload/drive/v3/files/${currentFileId}?uploadType=media&fields=id,modifiedTime`, body);
  PORTFOLIO_RAW = JSON.parse(body);
  portfolioModified = res.modifiedTime || portfolioModified;
  return res;
}
// 로그인이 그새 끊겼으면 조용히 한 번 갱신해보고 재시도한다.
async function driveWrite(url, body, retried){
  const r = await fetch(url, {
    method: 'PATCH',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body
  });
  if (r.status === 401 && !retried) {
    const refreshed = await silentRefresh();
    if (refreshed) return driveWrite(url, body, true);
    throw new Error('로그인이 만료됐습니다. 다시 로그인해주세요.');
  }
  if (r.status === 403 && !retried) {
    // 예전에 읽기 전용으로만 로그인해뒀던 경우, 조용한 갱신으로는 쓰기 권한을
    // 못 받으므로 동의 화면을 직접 띄워 확실하게 새 권한을 받는다.
    const upgraded = await interactiveWriteConsent();
    if (upgraded) return driveWrite(url, body, true);
    throw new Error('구글 드라이브 쓰기 권한이 필요합니다. 방금 뜬 동의 화면에서 허용해주세요.');
  }
  if (!r.ok) throw new Error('저장 실패 (' + r.status + ')');
  return r.json();
}

// ==== 자동 업데이트 멈춤 경고 ====
// 한국장(07:55~20:10) 또는 미국장(03:55~20:10 ET)이 열린 지 20분이 넘었는데 시세가 20분 넘게 그대로면 경고.
function marketOpenAt(t){
  const part = tz => { const o = {}; new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23' })
    .formatToParts(t).forEach(p => o[p.type] = p.value); return { wd: o.weekday, m: (+o.hour)*60 + (+o.minute) }; };
  const wk = d => d !== 'Sat' && d !== 'Sun';
  const k = part('Asia/Seoul'); if (wk(k.wd) && k.m >= 475 && k.m <= 1210) return true;
  const e = part('America/New_York'); if (wk(e.wd) && e.m >= 235 && e.m <= 1210) return true;
  return false;
}
function renderStale(){
  const el = document.getElementById('staleBanner');
  if (!el || !DATA) return;
  const now = new Date(), u = DATA.updatedAt ? new Date(DATA.updatedAt) : null;
  const age = u ? Math.round((now - u) / 60000) : null;
  if (marketOpenAt(now) && marketOpenAt(new Date(now - 20*60000)) && (age == null || age > 20)) {
    el.textContent = '⚠ 자동 시세 업데이트가 ' + (age == null ? '아직 한 번도 되지 않았어요' : (age >= 120 ? Math.floor(age/60) + '시간' : age + '분') + '째 멈춰 있어요')
      + '. PC에서 \'키 재인증\'이 필요할 수 있어요.';
    el.style.display = 'block';
  } else el.style.display = 'none';
}

function targetStockRatio(settings, market){
  const peak = settings.peakStockRatio;
  const dd = settings.maxDrawdownAssumption;
  const kd = market.kospiHigh ? (market.kospiNow - market.kospiHigh) / market.kospiHigh : 0;
  const nd = market.nasdaqHigh ? (market.nasdaqNow - market.nasdaqHigh) / market.nasdaqHigh : 0;
  const nw = settings.nasdaqWeight != null ? settings.nasdaqWeight : 0.85;
  const kw = settings.kospiWeight != null ? settings.kospiWeight : 0.25;
  const weighted = nd * nw + kd * kw;
  return Math.min(1, peak - (1 - peak) * weighted / dd);
}

function signalLabel(gap, th){
  th = th || {};
  const sell = th.sell != null ? th.sell : 0.06;
  const sellWatch = th.sellWatch != null ? th.sellWatch : 0.03;
  const buyWatch = th.buyWatch != null ? th.buyWatch : -0.03;
  const buy = th.buy != null ? th.buy : -0.06;
  if (gap >= sell) return { text: '매도', cls: 'sig-sell' };
  if (gap >= sellWatch) return { text: '매도 고민', cls: 'sig-sellwatch' };
  if (gap >= buyWatch) return { text: '관망', cls: 'sig-hold' };
  if (gap >= buy) return { text: '매수 고민', cls: 'sig-buywatch' };
  return { text: '매수', cls: 'sig-buy' };
}

function computeAccount(acc, fx, settings, market){
  let krStock = 0, usStock = 0;
  const rows = [];
  (acc.holdings || []).forEach((h, hi) => {
    const price = h.price || 0;
    const avg = h.avgPrice || 0;
    const val = (h.qty || 0) * price;
    const isUS = h.market === 'US';
    const valKR = isUS ? val * fx : val;
    const rate = (avg && price != null) ? (price - avg) / avg : null;
    const profitKR = (avg && price != null) ? (h.qty||0) * (price - avg) * (isUS ? fx : 1) : null;
    if (isUS) usStock += valKR; else krStock += valKR;
    rows.push({ hi, name: h.name || h.code, code: h.code, qty: h.qty || 0, price, avg, rate, profitKR,
      isUS, valKR, logo: h.logo, logos: h.logos });
  });
  const cash = (acc.cashKRW || 0) + (acc.cashUSD || 0) * fx;
  const total = krStock + usStock + cash;
  const seed = acc.seed || 0;
  const profit = total - seed;
  const profitRate = seed ? profit / seed : null;
  const stockRatio = total ? (krStock + usStock) / total : 0;
  // 미장(US) 먼저, 국장(KR) 나중 — 각 그룹 안에서는 수익금 내림차순
  rows.sort((a,b) => {
    if (a.isUS !== b.isUS) return a.isUS ? -1 : 1;
    const pa = a.profitKR==null ? -Infinity : a.profitKR;
    const pb = b.profitKR==null ? -Infinity : b.profitKR;
    return pb - pa;
  });

  let tRatio = null, gap = null, sig = null;
  let krGap = null, usGap = null, krGapRatio = null, usGapRatio = null;
  const krOnly = !!acc.krOnly;
  try{
    tRatio = targetStockRatio(settings, market);
    gap = stockRatio - tRatio;
    sig = signalLabel(gap, acc.thresholds);
    const dom = krOnly ? 1.0 : (settings.domesticTargetRatio != null ? settings.domesticTargetRatio : 0.5);
    const recKR = total * tRatio * dom;
    const recUS = total * tRatio * (1 - dom);
    krGap = krStock - recKR;
    usGap = usStock - recUS;
    const krRatio = total ? krStock / total : 0;
    const usRatio = total ? usStock / total : 0;
    krGapRatio = krRatio - tRatio * dom;
    usGapRatio = usRatio - tRatio * (1 - dom);
  } catch(e){}

  return { total, profit, profitRate, rows, cash, stockRatio, krStock, usStock,
    tRatio, gap, sig, krGap, usGap, krGapRatio, usGapRatio, krOnly };
}

// YYMMDD <-> 'YYYY-MM-DD' 변환
function yymmddToISO(s){
  s = String(s||'').replace(/[^0-9]/g,'');
  if (s.length !== 6) return null;
  return `20${s.slice(0,2)}-${s.slice(2,4)}-${s.slice(4,6)}`;
}
function isoToYYMMDD(iso){
  if (!iso) return '';
  const p = String(iso).split('-');
  if (p.length !== 3) return '';
  return p[0].slice(-2) + p[1] + p[2];
}

function trendPopupRangeBounds(){

  else if (preset === '6m') min.setMonth(min.getMonth() - 6);

function renderTrendPopupBody(){
  const sym = trendPopupCurrentSym;
  const arr = (DATA.trendHistory && DATA.trendHistory[sym]) || [];
  const { min, max, label } = trendPopupRangeBounds();

  const titleEl = document.getElementById('trendPopupTitle');
  if (titleEl) titleEl.textContent = `${sym} 추세 점수 (${label})`;
  updateTrendPresetButtons();

  const body = document.getElementById('trendPopupBody');
  if (!body) return;

  const minTime = min ? min.getTime() : -Infinity;
  const hasData = arr.some(r => {
    const t = new Date(r.date).getTime();
    return t >= minTime && t <= max.getTime();
  });

  if (!hasData) {
    body.innerHTML = `<div style="text-align:center;color:var(--dim);font-size:12.5px;padding:26px 0">
      이 기간에 기록된 점수가 없습니다. PC나 자동화가 돌면 하루 단위로 쌓입니다.</div>`;
    return;
  }
  body.innerHTML = `<div style="height:220px;position:relative"><canvas id="trendHistChart"></canvas></div>
    <div style="font-size:10.5px;color:var(--dim);margin-top:8px">빨간 점선: 매도 고려(40점) · 매도(70점) 기준선</div>`;

  const cv = document.getElementById('trendHistChart');
  if (!cv || !window.Chart) return;
  if (charts.trendHistChart) charts.trendHistChart.destroy();
  charts.trendHistChart = new Chart(cv, {
    type: 'line',
    data: { datasets: [{
      label: sym+' 점수', data: arr.map(r => ({ x: r.date, y: r.score })),
      borderColor: '#4c8dff', backgroundColor: '#4c8dff', tension: .25, pointRadius: 2, spanGaps: true
    }]},
    plugins: [trendThresholdLines],
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y + '점' } } },
      scales: {
        x: { type: 'time', min, max,
          time: { tooltipFormat: 'yyyy-MM-dd' },
          ticks: { color: '#5c6773', font: { size: 9.5 }, maxTicksLimit: 6 },
          grid: { color: '#20272f' } },
        y: { min: 0, max: 100, ticks: { color: '#5c6773', font: { size: 9.5 } }, grid: { color: '#20272f' } }
      }
    }
  });
}

function trendCell(sym, sig){
  const comp = sig && sig[sym] && sig[sym].composite;
  if (!comp) return `<div class="trend-cell" onclick="showTrendHistoryPopup('${sym}')" style="cursor:pointer"><div class="sym">${sym}</div><div class="lbl" style="color:var(--dim)">-</div></div>`;
  const lvlClass = comp.level === 'none' ? 'none' : comp.level === 'watch' ? 'watch' : comp.level === 'sell' ? 'sell' : 'strong';
  return `<div class="trend-cell ${lvlClass}" onclick="showTrendHistoryPopup('${sym}')" style="cursor:pointer">
    <div class="sym">${sym}</div>
    <div class="lbl">${esc(comp.label)}</div>
    <div class="score">${comp.score}/100</div>
  </div>`;
}

function renderTrendDetail(){
  const box = document.getElementById('trendDetailBody');
  if (!box) return;
  const trend = DATA.trendSignals;
  const order = [['RSI','RSI'],['PSAR','PSAR'],['VWAP','VWAP'],['ATR','ATR'],['MA','이평선']];
  const det = (trend && trend[trendDetailSym]) ? trend[trendDetailSym].details : null;
  const cell = ([key,label]) => {
    const s = (det && det[key]) || { state:'none', detail:'-' };
    const sell = (s.state==='sell' || s.state==='emergency');
    const locked = (s.state==='locked');
    const cls = locked ? 'locked' : (sell ? 'sell' : (s.state==='watch' ? 'watch' : ''));
    const txt = locked ? '잠금' : (sell ? '매도' : (s.state==='watch' ? '매도고려' : '-'));
    return `<div class="detail-cell ${cls}">
      <div class="k">${label}</div><div class="v">${txt}</div><div class="d">${esc(s.detail||'')}</div>
    </div>`;
  };
  const sel = `<select class="trend-sel" onchange="onTrendDetailSel(this.value)">
    ${['QQQ','SOXX','EWY'].map(s => `<option value="${s}" ${s===trendDetailSym?'selected':''}>${s} 세부 보기</option>`).join('')}
  </select>`;
  box.innerHTML = `${sel}<div class="detail-row">${order.map(cell).join('')}</div>`;
}

function logoImg(row, ai){
  const letter = (row.name || row.code || '?').trim().charAt(0);
  const list = (row.logos && row.logos.length) ? row.logos : (row.logo ? [row.logo] : []);
  if (!list.length) return `<span class="h-avatar">${esc(letter)}</span>`;
  const json = esc(JSON.stringify(list));
  const idAttrs = (ai != null && row.hi != null) ? `data-ai="${ai}" data-hi="${row.hi}"` : '';
  const clickAttr = (ai != null && row.hi != null) ? `onclick="event.stopPropagation();logoCycle(this)" style="cursor:pointer"` : '';
  return `<img class="h-logo" src="${esc(list[0])}" data-cands="${json}" data-i="0" ${idAttrs} ${clickAttr} onerror="logoFallback(this)">`;
}
// 앰블럼을 탭하면 다음 후보로 순환한다. 다른 수정과 달리, 이 기능은
// 클릭 즉시 조용히 구글 드라이브에 저장된다.
async function logoCycle(img){
  let list = []; try{ list = JSON.parse(img.getAttribute('data-cands')); }catch(e){}
  if (!list.length) return;
  let i = parseInt(img.getAttribute('data-i')||'0',10) + 1;
  if (i >= list.length) i = 0;   // 마지막 후보 다음엔 처음으로 순환
  img.setAttribute('data-i', i);
  img.src = list[i];
  const ai = img.getAttribute('data-ai'), hi = img.getAttribute('data-hi');
  if (ai == null || hi == null) return;
  const h = DATA.accounts[ai] && DATA.accounts[ai].holdings[hi];
  if (!h) return;
  // 고른 후보를 맨 앞으로 보내 다음부터도 이 로고가 먼저 시도되게 고정
  const chosen = list[i];
  const accId = DATA.accounts[ai].id, key = qkey(h);
  const pin = () => {
    const acc = (DATA.accounts || []).find(a => a.id === accId);
    const hh = acc && (acc.holdings || []).find(x => qkey(x) === key);
    if (!hh) return false;
    hh.logos = [chosen, ...list.filter(u => u !== chosen)];
    hh.logo = chosen;
    hh.logoPinned = true;   // 사용자가 직접 고른 값이므로 이후 자동 재계산에서 제외
    return true;
  };
  pin();
  try {
    try { await driveSave(); }
    catch(e) {
      if (!e.conflict) throw e;
      await loadPortfolio();            // 다른 기기가 먼저 저장 → 최신을 받은 뒤 로고만 다시 적용
      if (pin()) await driveSave();
    }
    setUpdatedLabel();
  } catch(e) {
    console.error('로고 선택 저장 실패:', e);
  }
}
function logoFallback(img){

let pieExcluded = {};   // {계좌인덱스: Set(제외된 종목명)}
function togglePieExclude(ai, name){
  if (!pieExcluded[ai]) pieExcluded[ai] = new Set();
  if (pieExcluded[ai].has(name)) pieExcluded[ai].delete(name);
  else pieExcluded[ai].add(name);
  renderAllPies();
}

function renderAllPies(){
  const fx = (DATA.market && DATA.market.usdKrw) || 0;
  const settings = DATA.settings || {}, market = DATA.market || {};
  (DATA.accounts || []).forEach((acc, ai) => {
    if (!openAccts[acc.id]) return;
    const cv = document.getElementById('pie-' + ai);
    if (!cv || !window.Chart) return;
    const r = computeAccount(acc, fx, settings, market);
    const excluded = pieExcluded[ai] || new Set();

    // 색은 "전체 목록 기준"으로 미리 정해두고, 어떤 종목을 뺐다 넣었다 해도
    // 나머지 종목들 색은 안 바뀌게 한다.
    const colorByName = {};
    r.rows.forEach((row, i) => { colorByName[row.name] = CHART_COLORS[i % CHART_COLORS.length]; });
    const visibleRows = r.rows.filter(row => !excluded.has(row.name));

    const key = 'pie' + ai;
    if (charts[key]) charts[key].destroy();
    charts[key] = new Chart(cv, {
      type: 'doughnut',
      data: {
        labels: visibleRows.map(x => x.name),
        datasets: [{ data: visibleRows.map(x => x.valKR),
          backgroundColor: visibleRows.map(x => colorByName[x.name]),
          borderColor: '#111722', borderWidth: 2 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },   // 캔버스 안 범례는 스크롤이 안 돼서 끄고, 옆에 HTML 목록으로 따로 그림
          tooltip: { callbacks: { label: c => c.label + ': ' + won(c.parsed) + '원' } }
        }
      }
    });

    // Chart.js가 데이터 순서대로 색을 배정하는 것과 동일한 규칙(색 배열을 순서대로 순환)으로
    // HTML 범례를 만든다 — 이러면 원 그래프 색과 범례 색이 항상 일치한다.
    // 범례 항목을 터치하면 그 종목만 파이 차트에서 뺐다 넣었다 할 수 있다(파이 조각 자체는 터치 대상 아님).
    const legendEl = document.getElementById('pieLegend-' + ai);
    if (legendEl) {
      legendEl.innerHTML = r.rows.map((row, i) => {
        const color = colorByName[row.name];
        const isOff = excluded.has(row.name);
        return `<div class="pie-legend-row ${isOff?'off':''}" onclick="togglePieExclude(${ai},${jsa(row.name)})">
          <span class="pie-legend-dot" style="background:${color}"></span>
          <span class="pie-legend-name">${esc(row.name)}</span>
        </div>`;
      }).join('');
    }
  });
}

// 버튼 하나로 1M -> 3M -> 6M -> 1Y -> 1M -> ... 순환. 지금 커스텀 지정 중이거나
// 프리셋이 하나도 안 걸려있으면 1M부터 다시 시작한다.
function cycleProfitPreset(){
  const order = ['1m','3m','6m','1y'];
  const current = profitDateRange ? null : profitPreset;
  const idx = order.indexOf(current);
  const next = order[(idx + 1) % order.length];
  setProfitPreset(next);
}
function updateProfitPresetButtons(){
  const btn = document.getElementById('profitPresetCycleBtn');
  if (!btn) return;
  const map = { '1m': '1M', '3m': '3M', '6m': '6M', '1y': '1Y' };
  const active = profitDateRange ? null : profitPreset;
  btn.textContent = map[active] || '1M';
  btn.classList.toggle('active', !!active);
}
// 'YYYY-MM-DD' -> 'YYMMDD'
function fmtYYMMDD(dateStr){
  const parts = String(dateStr).split('-');
  if (parts.length !== 3) return dateStr;
  return parts[0].slice(-2) + parts[1] + parts[2];
}

let comparePoints = [];
