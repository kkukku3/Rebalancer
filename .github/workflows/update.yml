name: 리밸런서 자동 시세 업데이트

on:
  schedule:
    # 깃허브 자체 예약은 지연이 심해서 백업 용도로만 둠.
    # 실제 1분 간격 실행은 외부 cron-job.org 가 workflow_dispatch 로 깨운다.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "장 마감 시간이어도 실행"
        type: boolean
        default: false

# 실행이 겹치면 '진행 중인 실행은 끝까지 하고' 다음 실행은 하나만 대기시킨다.
# (예전의 cancel-in-progress: true 는 실행이 1분을 넘으면 매번 취소돼 업데이트가 멈출 수 있었음)
concurrency:
  group: rebalancer-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Seoul
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 시세 업데이트 실행
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: python cloud_update.py
